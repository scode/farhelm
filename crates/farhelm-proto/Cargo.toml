[package]
name = "farhelm-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire types and protocol version shared by helm and supervisor"

# A library; see `farhelm-helm/Cargo.toml` for why every non-shipping member
# says so explicitly instead of relying on having no binary target.
[package.metadata.dist]
dist = false

[dependencies]
# The UI channel's command paths (`ui_channel::ApiPath`): built percent-encoded, parsed with escapes decoded.
percent-encoding.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
thiserror.workspace = true
# The async frame reader/writer and TCP relay bookkeeping.
tokio.workspace = true
# Bash placement is authoritative at admission and spawn.
tree-sitter.workspace = true
tree-sitter-bash.workspace = true

[dev-dependencies]
farhelm-testtrace.workspace = true
