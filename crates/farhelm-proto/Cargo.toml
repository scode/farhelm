[package]
name = "farhelm-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire types and protocol version shared by helm and supervisor"

# A library; see `farhelm-helm/Cargo.toml` for why every non-shipping member
# says so explicitly instead of relying on having no binary target.
[package.metadata.dist]
dist = false

[dependencies]
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
thiserror.workspace = true
# The async frame reader/writer and native TCP relay bookkeeping need tokio. It is optional so
# `farhelm-ui`'s wasm build can depend on the wire types themselves: the
# workspace's tokio features (net, process) do not build for wasm32.
tokio = { workspace = true, optional = true }

# Bash placement is authoritative at native admission and spawn. The browser keeps its literal
# shape precheck; it does not need the native C parser runtime in its wire-types dependency.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tree-sitter.workspace = true
tree-sitter-bash.workspace = true

[features]
# Every native consumer wants frame I/O and relay bookkeeping, so they stay on by default; only the
# browser build turns it off. The test module exercises `io.rs` and assumes this
# default, so `--no-default-features` is a build configuration (checked by
# compiling farhelm-ui for wasm32), not a supported test configuration.
default = ["io"]
io = ["dep:tokio"]

[dev-dependencies]
farhelm-testtrace.workspace = true
