[package]
name = "farhelm-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-host session management: tmux driver, agent integrations, state"

# A library; see `farhelm-helm/Cargo.toml` for why every non-shipping member
# says so explicitly instead of relying on having no binary target. The
# supervisor reaches a host as the `farhelm` multi-call binary, not as an
# artifact of its own.
[package.metadata.dist]
dist = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
farhelm-proto.workspace = true
getrandom.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Per-test capture owns each test's dispatcher and Tokio runtime without
# installing a subscriber shared by concurrently running tests.
farhelm-testtrace.workspace = true
tempfile.workspace = true
# test-util enables tokio's virtual clock (`#[tokio::test(start_paused =
# true)]`), used by the drain_writer tests so they assert real-time
# behavior deterministically instead of racing wall-clock sleeps against
# window lengths.
tokio = { workspace = true, features = ["test-util"] }
# Round-trip-parses `agent_kind::toml_basic_string`'s hand-rendered output
# in tests; not a runtime dependency (see that function's doc comment for
# why the supervisor renders TOML by hand instead of depending on a writer
# for it).
toml.workspace = true
