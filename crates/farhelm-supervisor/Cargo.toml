[package]
name = "farhelm-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-host session management: tmux driver, agent integrations, state"

[dependencies]
anyhow.workspace = true
base64.workspace = true
farhelm-proto.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# test-util enables tokio's virtual clock (`#[tokio::test(start_paused =
# true)]`), used by the drain_writer tests so they assert real-time
# behavior deterministically instead of racing wall-clock sleeps against
# window lengths.
tokio = { workspace = true, features = ["test-util"] }
