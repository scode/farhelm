[package]
name = "farhelm-helm-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The GPUI desktop app's connection to its helm: the UI channel and terminal streams"

# A library; see `farhelm-helm/Cargo.toml` for why every non-shipping member
# says so explicitly instead of relying on having no binary target.
[package.metadata.dist]
dist = false

[features]
# The in-process fakes of the UI channel and the terminal streams (`src/fake.rs`) that GUI tests drive in place of a
# helm. A shipped build never needs them, so only test builds turn this on: farhelm-gui's dev-dependency does.
test-support = []

# This crate lives outside `crates/gui/` on purpose: it owns the async runtime and its threads, which the GUI crates'
# bans (crates/gui/clippy.toml) forbid everywhere else. SPEC_impl.md, "Where the GUI meets the helm", names it the
# GUI's one exemption from that ban. It must never depend on the helm crate (dev-dependencies excepted, for tests
# against a real helm); `scripts/check-crate-layering.py` keeps the GUI crates from reaching the helm through it.
[dependencies]
farhelm-proto.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
farhelm-helm.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# The GUI calls into this crate from its platform callbacks, where a panic aborts the app on macOS, so it never unwraps
# or expects outside tests (`clippy.toml` beside this manifest lets tests). SPEC_impl.md, "Where the GUI meets the
# helm"; `scripts/check-crate-layering.py` checks this table is here.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
