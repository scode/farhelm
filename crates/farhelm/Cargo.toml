[package]
name = "farhelm"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
description = "The multi-call farhelm binary: helm, supervisor, internal commands"

# The one package cargo-dist builds with cargo: three targets (D4), one bare
# binary per archive. `dist = true` records this package's explicit intent to
# ship rather than leaving it to inference.
#
# It does NOT protect the other members: cargo-dist 0.32 reads this key
# per-package, and its default for a package it has not been told about is to
# ship it if it has distributable binaries. So the rule is a repository
# convention, not something the tooling enforces — EVERY new workspace member
# states `dist = true` or `dist = false` in its own manifest. Skip that and a
# new binary crate can reach a public release; the signing gate's inventory
# would refuse the unfamiliar asset, but only after cargo-dist had already
# created the release.
[package.metadata.dist]
dist = true

# The two static tmux builds (D5) ride along as extra artifacts of this
# package. They are not cargo output at all — `build-tmux-assets.sh`
# cross-compiles them with zig — so dist runs that script and uploads what it
# names, unpacked, next to the archives.
#
# Two placements matter here and are easy to get wrong:
#
# - `working-dir` defaults to the directory of the manifest that declares the
#   artifacts, i.e. `crates/farhelm`. The script and the paths below are
#   repository-relative, so it is pointed back at the repository root.
# - dist builds extra artifacts in the GLOBAL job, which does NOT run the
#   `github-build-setup` steps (those are per-target build jobs only). That is
#   why the script provisions its own zig toolchain instead of relying on the
#   build setup the way the cargo builds do.
#
# The artifact ID dist publishes is each path's BASENAME, so staging them
# under `target/` keeps the working tree clean without changing the asset
# names `assets.rs` promises.
[[package.metadata.dist.extra-artifacts]]
working-dir = "../.."
artifacts = [
  "target/tmux-assets/tmux-x86_64-unknown-linux-musl",
  "target/tmux-assets/tmux-aarch64-unknown-linux-musl",
]
build = ["./scripts/build-tmux-assets.sh"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
farhelm-helm.workspace = true
farhelm-proto.workspace = true
farhelm-supervisor.workspace = true
# `internal sweep-test-state` (main.rs): the test harnesses' /tmp sweep
# ships in the product binary because e2e/start-stack.sh already requires
# the built binary and must not grow a second, diverging shell copy of the
# sweep. A regular dependency rather than a dev-dependency on purpose —
# dev targets see regular deps too, so this one entry also serves the
# integration tests under tests/ that route their state dirs through it.
farhelm-teststate.workspace = true
# Only for the `hexecho` fake-agent script's raw-mode termios calls
# (fake_agent.rs); everything else in this binary stays on tokio/std.
libc.workspace = true
# The record-writing fake-agent scripts build conversation records the
# supervisor then parses; a hand-rolled escaper would make a fixture bug
# look like a parser bug (fake_agent.rs).
serde_json.workspace = true
# `farhelm helm setup` publishes each unit file through a uniquely named,
# exclusively created staging file in the unit directory (setup.rs). A
# predictable staging name is a symlink target and a race between two
# setups; tempfile is the same crate the tests already used, promoted to a
# regular dependency so the product path can use it too.
tempfile.workspace = true
tokio.workspace = true
# `tracing-subscriber` installs the subscriber (init_tracing); `tracing`
# itself is here for the handful of diagnostics this binary emits on its
# own — the `FARHELM_AGENT_HOOKS` startup warning in main.rs — rather than
# through a library crate. The attachment-diagnostics test also implements
# a `tracing` layer against it.
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The two-host aggregation test drives a REAL `farhelm helm run` over real
# loopback HTTP (merged_hosts.rs), because that is the only way to exercise
# the shipped binary's own serving path; a hand-rolled HTTP client would be
# a second, worse thing to maintain. Loopback only, so no TLS backend is
# needed and the workspace's default-feature-less reqwest is enough.
reqwest.workspace = true
shell-words.workspace = true
