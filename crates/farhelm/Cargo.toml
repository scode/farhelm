[package]
name = "farhelm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The multi-call farhelm binary: helm, supervisor, internal commands"

[dependencies]
anyhow.workspace = true
clap.workspace = true
farhelm-helm.workspace = true
farhelm-proto.workspace = true
farhelm-supervisor.workspace = true
# Only for the `hexecho` fake-agent script's raw-mode termios calls
# (fake_agent.rs); everything else in this binary stays on tokio/std.
libc.workspace = true
# The record-writing fake-agent scripts build conversation records the
# supervisor then parses; a hand-rolled escaper would make a fixture bug
# look like a parser bug (fake_agent.rs).
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The two-host aggregation test drives a REAL `farhelm helm run` over real
# loopback HTTP (merged_hosts.rs), because that is the only way to exercise
# the shipped binary's own serving path; a hand-rolled HTTP client would be
# a second, worse thing to maintain. Loopback only, so no TLS backend is
# needed and the workspace's default-feature-less reqwest is enough.
reqwest.workspace = true
shell-words.workspace = true
tempfile.workspace = true
# The attachment-diagnostics test implements a `tracing` layer to capture
# the transfer trail's structured FIELDS; the binary itself only needs
# tracing-subscriber to install a subscriber.
tracing.workspace = true
