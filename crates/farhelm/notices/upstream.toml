# Code a crate compiles into the binary under a license the crate does not declare, so cargo-about never reports it.
# Each `[[extra]]` entry adds its own section for the crates named; it fails generation as stale once the graph no
# longer has every one of them.
[[extra]]
license = "FTL"
name = "Freetype Project License"
crates = ["freetype-sys 0.20.1"]
file = "upstream/freetype-2.13.2-FTL.txt"
