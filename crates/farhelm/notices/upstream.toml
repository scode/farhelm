# License texts for dependencies whose notice cargo-about cannot print as the crate publishes it: the package carries no
# usable notice for a license (cargo-about would print the SPDX template, with `<year> <copyright holders>` in place of
# a copyright line), or the notice spans several files cargo-about prints only one of. Each entry names the crates and
# versions it covers, the license, and a file under `upstream/` whose "Upstream text:" lines cite where the text comes
# from: the crate's own repository, or the crate's own package where the package holds the files. A few files add one
# hand-written, cited sentence saying that upstream publishes no copyright line, before the license terms.
# `scripts/dependency-notices.py` puts that text in place of cargo-about's for exactly those crates.
#
# A crate whose one license file cargo-about merely failed to pick up belongs in `about.toml` as a `clarify` entry
# instead.
#
# Every entry must still match the dependency graph: a version bump fails generation until the new version's text is
# checked and the entry updated. Texts come from the crate's own repository at the commit its package was published from
# (`.cargo_vcs_info.json`) or from its package, apart from the cited sentence above. `no-copyright-line = true`
# acknowledges that upstream publishes no copyright line at all for that version; the text then states that and gives
# the license terms, and `reason` says what was checked. Generation fails for any MIT, BSD, ISC, Zlib or NCSA text
# without a copyright line that is not acknowledged here.

[[text]]
license = "MIT"
crates = ["objc-sys 0.3.5", "objc2 0.5.3", "objc2-app-kit 0.2.2", "objc2-foundation 0.2.2"]
file = "upstream/objc2-0.5-line-MIT.txt"

[[text]]
license = "MIT"
crates = ["block2 0.6.2", "objc2 0.6.5", "objc2-encode 4.1.0", "objc2-foundation 0.3.2"]
file = "upstream/objc2-0.6-line-MIT.txt"
no-copyright-line = true
reason = "At each crate's published commit the objc2 repository holds only LICENSE.md, which names MIT without a copyright line; the crate directories hold no license file."

