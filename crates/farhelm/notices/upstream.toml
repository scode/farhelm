file = "upstream/zvariant_utils-4.2.0-MIT.txt"

# These crates' published MIT text has no copyright line, and neither does their upstream repository's at the
# published commit (checked file by file); cargo-about's text is theirs unchanged, so no file replaces it.
[[text]]
license = "MIT"
crates = ["endi 1.1.1"]
no-copyright-line = true
reason = "github.com/zeenix/endi at 226224559725a9ef0e0687b3a54eca9ad6a5a6c7: LICENSE-MIT has no copyright line."

[[text]]
license = "MIT"
crates = ["zbus-lockstep 0.5.2", "zbus-lockstep-macros 0.5.2"]
no-copyright-line = true
reason = "github.com/luukvanderduim/zbus-lockstep at 9bda5264dfe1dc7eaa7738f839ff977315c31b84: each crate's LICENSE-MIT has no copyright line, and the repository root has no license file."

[[text]]
