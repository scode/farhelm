[package]
name = "farhelm-helm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The control plane: host registry, SSH transport, aggregation, HTTP/WS API"

# A library: it reaches users linked into `farhelm` (and `farhelm-desktop`),
# never as an asset of its own. Stated explicitly so that adding a binary
# target here later — a debugging tool, a one-off — cannot quietly grow the
# release's asset list, which `assets.rs` and `install.sh` treat as a fixed
# contract.
[package.metadata.dist]
dist = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
farhelm-proto.workspace = true
farhelm-supervisor.workspace = true
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
include_dir.workspace = true
json5.workspace = true
libc.workspace = true
mime_guess.workspace = true
minisign-verify.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shell-words.workspace = true
subtle.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# test-util enables tokio's virtual clock (`#[tokio::test(start_paused =
# true)]`), used by the upload-relay stall tests so a sixty-second
# no-progress bound is asserted exactly instead of waited out.
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
# Test-owned capture carries the wrapped test's dispatcher into its Tokio
# runtime, including worker and blocking threads, without a subscriber shared
# by concurrently running tests.
farhelm-testtrace.workspace = true
