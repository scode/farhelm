[package]
name = "farhelm-desktop"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
description = "The Farhelm desktop app: the embedded helm, the local supervisor and the app's updater"

# The library half is what the GPUI app links: the bootstrap, the updater and the app's state files. It is the only
# crate that depends on both the helm and the GUI (SPEC_impl.md, "GUI architecture").
[lib]
path = "src/lib.rs"

# Naming the bin explicitly pins the installed file name: `install.sh` puts `farhelm` and `farhelm-desktop` side by
# side, and the app finds its CLI sibling by that exact name.
[[bin]]
name = "farhelm-desktop"
path = "src/main.rs"

[features]
# The GPUI app's test-automation bridge, for development runs driven by `scripts/gui-agent.py` (docs/gui-agent.md).
# Debug builds only: farhelm-gui refuses to compile it into an optimized build, so a release or devbuild cannot carry
# it. It also makes the app write its helm's address and a credential for this process into the file named by
# `FARHELM_DESKTOP_AGENT_HELM_FILE`, which is how that script seeds sessions through the real helm API.
agent = ["farhelm-gui/agent"]

[dependencies]
anyhow.workspace = true
# Native file downloads use the platform's account-specific Downloads folder; the helm receives the capability.
dirs = "6"
# The GPUI app this process runs once the helm and supervisor are up. The desktop binary is the one place the GUI and the
# helm meet (SPEC_impl.md, "Where the GUI meets the helm").
farhelm-gui.workspace = true
farhelm-helm.workspace = true
# The GPUI app's helm endpoint type, which the desktop builds from the embedded helm's address and credential.
farhelm-helm-client.workspace = true
# The shared presentation-unsafe character table, for host text in a startup refusal, and the development-build rule
# the update readout uses.
farhelm-proto.workspace = true
farhelm-supervisor.workspace = true
# The app starts its supervisor in a session of its own (`setsid`), so the supervisor outlives the app and no signal
# aimed at the app's terminal reaches it.
libc.workspace = true
# Startup reads the embedded helm's host listing over loopback; the updater asks get.farhelm.io for the latest release.
reqwest.workspace = true
# The updater refuses a latest-release answer or a compiled version that does not parse as a release. Version ORDER is
# not computed here: it comes from `farhelm_helm::build_is_newer`, so there is one rule for which build is newer.
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
# The updater checks a downloaded `install.sh` against its entry in the release's signed `SHA256SUMS` before running it.
sha2.workspace = true
tokio.workspace = true
# This binary embeds a helm in its own process rather than running `farhelm helm run`, so it installs its own
# subscriber (`init_tracing` in src/lib.rs).
tracing.workspace = true
tracing-subscriber.workspace = true
# Names the updater's private download directory.
uuid.workspace = true
# A helm-admitted link opens natively. `hardened` refuses anything but http(s) URLs, so a future caller that skips the
# helm's validation still cannot open a local file or another scheme.
webbrowser = { version = "1.1.0", features = ["hardened"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Opens a saved download through the desktop's dispatch API rather than waiting for xdg-open, whose generic fallback can
# wait for the opened app to exit (`open_saved_file` in src/lib.rs).
gio = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# Reads the global `AppleKeyboardUIMode` preference behind System Settings' Keyboard navigation switch, which decides
# which controls Tab reaches (src/tab_reach.rs; settled for the GPUI migration on 2026-11-13: the Mac keeps the old
# app's behavior). GPUI's macOS backend already links both.
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows' std::fs::rename refuses an existing destination; MoveFileExW keeps the state files' replacement atomic
# without deleting the prior record.
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
farhelm-teststate.workspace = true
# Per-test tracing capture. The attribute owns an isolated dispatcher and, for async tests, a Tokio runtime.
farhelm-testtrace.workspace = true
tempfile.workspace = true

# Not built by cargo-dist's cargo build. The release still describes the shipped `farhelm-desktop` as a generic package
# (`packaging/farhelm-desktop/dist.toml`) whose build command ran dx over the old Dioxus app; that build is broken until
# the GPUI cutover replaces it. `dist = false` keeps cargo-dist from also publishing an archive for this binary target
# under the same name.
[package.metadata.dist]
dist = false

# The desktop app's process runs the GPUI app and its platform callbacks, where a panic aborts the app on macOS, so it
# never unwraps or expects outside tests (`clippy.toml` beside this manifest lets tests). SPEC_impl.md, "Where the GUI
# meets the helm"; `scripts/check-crate-layering.py` checks this table is here.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
