[package]
name = "farhelm-desktop"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
description = "Farhelm desktop window (webview shell around the helm)"

# The whole reason this crate exists is to be a BINARY with no library half
# (D6). Naming the bin explicitly pins the installed file name — `install.sh`
# puts `farhelm` and `farhelm-desktop` side by side, and the shell finds its
# CLI sibling by that exact name.
[[bin]]
name = "farhelm-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# The `desktop` feature is not optional here: it is what this crate is. It
# pulls in dioxus-desktop, wry, and WebKit, which is why the workspace's
# `default-members` excludes this package.
farhelm-ui = { workspace = true, features = ["desktop"] }

# The shipped `farhelm-desktop` binary IS built from this crate, but not by
# cargo-dist's cargo build — dx has to rewrite the `asset!()` paths into it
# after the link, or the window renders nothing (see this crate's README).
# dist reaches it through a generic package instead
# (`packaging/farhelm-desktop/dist.toml`), whose build command runs dx over
# this crate. `dist = false` here is what keeps the two descriptions from
# both producing an asset: cargo-dist would otherwise see a binary target and
# publish a placeholder-ridden archive under the same name.
[package.metadata.dist]
dist = false
