[package]
name = "farhelm-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The GPUI desktop GUI: views and the app-wide foundations they build on"

# A library; see `farhelm-helm/Cargo.toml` for why every non-shipping member
# says so explicitly instead of relying on having no binary target.
[package.metadata.dist]
dist = false

[features]
# The test-automation bridge (`gpui-agent`), which lets an agent drive the running app through an unauthenticated
# socket. Never in a shipped build or a devbuild: any process running as the same user could click Allow on its own
# approval card. `src/lib.rs` refuses to compile it into an optimized build, which is what releases and devbuilds are.
# It turns on GPUI's test support because the bridge's screenshots render through GPUI's test-only capture.
agent = ["dep:gpui-agent", "gpui/test-support", "gpui_platform/test-support"]

# GPUI and GPUI Kit at their exact pins (root Cargo.toml), routed through the vendored, patched GPUI trees.
[dependencies]
anyhow.workspace = true
# The one escape table and notation for host-supplied text, shared with the command line (`farhelm_proto::text`).
farhelm-proto.workspace = true
gpui.workspace = true
gpui-agent = { workspace = true, optional = true }
gpui-base.workspace = true
gpui-component.workspace = true
gpui_platform.workspace = true
# Kit's theme is configured from JSON (`ThemeConfig`); the theme module projects Farhelm's tokens onto it.
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
# `leak-detection` is what makes GPUI's leak checks check anything: without it they are no-ops (SPEC_impl.md, "GPUI
# cookbook: traps"). `test-support` brings the test contexts and the headless capture.
gpui = { workspace = true, features = ["test-support", "leak-detection"] }
gpui_platform = { workspace = true, features = ["test-support"] }
# The real text system and headless renderer for layout-dependent tests and screenshot goldens: GPUI's test context
# fakes text (every character the same width), which proves nothing about layout.
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12" }
image = { version = "0.25", default-features = false, features = ["png"] }

# A panic inside an AppKit callback aborts the app, and nearly all GUI code runs inside one, so the GUI crates never
# unwrap or expect outside tests (crates/gui/clippy.toml lets tests). SPEC_impl.md, "Startup and quit: the bootstrap".
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
