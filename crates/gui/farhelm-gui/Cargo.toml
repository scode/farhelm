[package]
name = "farhelm-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The GPUI desktop GUI: views and the app-wide foundations they build on"

# A library; see `farhelm-helm/Cargo.toml` for why every non-shipping member
# says so explicitly instead of relying on having no binary target.
[package.metadata.dist]
dist = false

[features]
# The test-automation bridge (`gpui-agent`), which lets an agent drive the running app through an unauthenticated
# socket. Never in a shipped build or a devbuild: any process running as the same user could click Allow on its own
# approval card. `src/agent_startup.rs` refuses to compile it into an optimized build, which is what releases and
# devbuilds are.
# It turns on GPUI's test support because the bridge's screenshots render through GPUI's test-only capture.
agent = ["dep:gpui-agent", "gpui/test-support", "gpui_platform/test-support"]

# GPUI and GPUI Kit at their exact pins (root Cargo.toml), routed through the vendored, patched GPUI trees.
[dependencies]
anyhow.workspace = true
# The terminal's grid protocol model, one of its two framework-free halves (key and pointer encoding,
# `farhelm-input-mapping`, is the other). Both carry code ported from xterm.js and VS Code, so linking them obliges the
# app to carry their notices (`PORTED_CODE_NOTICES` in `src/lib.rs`).
farhelm-grid-model.workspace = true
# The GUI's connection to its helm (the UI channel). Like `farhelm-proto`, it does not depend on the helm crate
# (scripts/check-crate-layering.py), and it is the one place the GUI's async runtime lives.
farhelm-helm-client.workspace = true
# The terminal's key and pointer encoding; ported code, like `farhelm-grid-model` above.
farhelm-input-mapping.workspace = true
# The protocol crate, for two things: the shared wire types, and the one escape table and notation for host-supplied
# text, which the command line uses too (`farhelm_proto::text`).
farhelm-proto.workspace = true
gpui.workspace = true
gpui-agent = { workspace = true, optional = true }
# Also used directly to refresh the motion setting on macOS. GPUI Kit asks for its base crate as `^0.9.1`, so the
# root manifest's exact `=0.9.1` keeps an update from moving the base crate on its own while Kit stays pinned.
gpui-base.workspace = true
gpui-component.workspace = true
gpui_platform.workspace = true
# For `DeserializeOwned` only: the operation store's `read` decodes a helm reply into the type its caller names. Already
# built for `serde_json`, so naming it adds no crate.
serde.workspace = true
# Kit's theme is configured from JSON (`ThemeConfig`); the theme module projects Farhelm's tokens onto it.
serde_json.workspace = true
tracing.workspace = true
# For comparing two server addresses by origin the way the helm does (Settings' ntfy form says before saving whether a
# saved token goes with a new server). Already built for the terminal's grid model, so naming it adds no crate.
url.workspace = true

[dev-dependencies]
# The fake helm and fake terminal streams GUI tests run against. Only here, so the app itself never compiles them.
farhelm-helm-client = { workspace = true, features = ["test-support"] }
# `leak-detection` is what makes GPUI's leak checks check anything: without it they are no-ops (SPEC_impl.md, "GPUI
# cookbook: traps"). `test-support` brings the test contexts and the headless capture.
gpui = { workspace = true, features = ["test-support", "leak-detection"] }
gpui_platform = { workspace = true, features = ["test-support"] }
# The real text system and headless renderer for layout-dependent tests and screenshot goldens: GPUI's test context
# fakes text (every character the same width), which proves nothing about layout.
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12" }
image = { version = "0.25", default-features = false, features = ["png"] }

# macOS's own text system (CoreText through GPUI's Mac text system), for the host-sentence tests that must see how a Mac
# shapes isolates: the Linux engine above is not what a Mac user's text goes through, and the platform object that owns
# it can only be built on the main thread, which no test runs on. Already built for the Mac platform crate, so naming
# it adds no crate.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.12", features = ["font-kit"] }

# A panic inside an AppKit callback aborts the app, and nearly all GUI code runs inside one, so the GUI crates never
# unwrap or expect outside tests (crates/gui/clippy.toml lets tests). SPEC_impl.md, "Startup and quit: the bootstrap".
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
