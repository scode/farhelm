[package]
name = "farhelm-teststate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared /tmp naming, locking, and sweeping for Farhelm's test harnesses"

# Test-harness support, never shipped; see `farhelm-helm/Cargo.toml` for why
# every non-shipping member says so explicitly.
[package.metadata.dist]
dist = false

[dependencies]
# flock and geteuid. The lock protocol is flock-based on purpose: an flock
# dies with its holder, which is what makes "is this run alive" answerable
# after a SIGKILL when a PID file would lie.
libc.workspace = true
# `TestDir` wraps a real `TempDir` so the normal (non-killed) path keeps
# tempfile's battle-tested drop-time removal; this crate only adds the
# naming and the lock on top.
tempfile.workspace = true
# Fixture-thread lifecycle diagnostics are tracing events so tests can retain
# bounded evidence without coupling the owner to a particular logger.
tracing.workspace = true

[dev-dependencies]
# Focused owner tests assert lifecycle diagnostics through the bounded capture
# wrapper; this support crate does not participate in the runtime dependency.
farhelm-testtrace = { path = "../farhelm-testtrace" }
