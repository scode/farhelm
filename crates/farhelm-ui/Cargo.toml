[package]
name = "farhelm-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Dioxus UI, built for web (wasm) and desktop from one crate"

# Not a release asset, and here that is load-bearing rather than a formality:
# this crate has a `src/main.rs` (dx's entry point for the web and desktop
# builds), so cargo-dist would otherwise see a binary target and publish a
# `farhelm-ui-<target>.tar.gz` nobody asked for. What ships from this crate is
# the web bundle dx produces, compiled into `farhelm-helm` (D12).
[package.metadata.dist]
dist = false

[dependencies]
dioxus.workspace = true
# Races renderer bridge calls against one deadline on both wasm and desktop.
# The JavaScript commit still guards its own side effect because dropping the
# Rust future cannot cancel script that the renderer has already started.
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Parses a launch command's argv the same way the supervisor does
# (`farhelm-supervisor`'s own profile-invocation validation), so the row's
# compact invocation badge (`list::row::compact_invocation`) derives its
# program basename and marker candidates from real shell-word splitting
# instead of a partial hand-rolled parser. Pure Rust with no OS glue, so it
# compiles to wasm exactly as this crate's web target needs.
shell-words.workspace = true
# `Instant` with the standard monotonic contract on both native and wasm.
# The wasm standard library does not implement `std::time::Instant`, while
# popup focus deadlines must use one Rust-owned clock on both renderers.
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `Storage` is added on top of the workspace features (which carry
# `Window`/`Location` for every crate that needs them) for the per-client
# preferences the browser build keeps in localStorage.
web-sys = { workspace = true, features = ["Storage"] }
# List-view and session-detail polling sleep (PLAN_M2.md step 7 / PLAN_M4.md
# item 6; `ListView` in src/list.rs, `SessionView` in src/session_view.rs,
# both sharing `POLL_INTERVAL_MS` from src/api.rs): `TimeoutFuture` wraps
# `setTimeout` for this one-shot sleep — see the workspace `Cargo.toml` entry
# for why the desktop target instead reuses `tokio::time::sleep`.
gloo-timers.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
# Native system-clipboard writes for the desktop shell (`desktop.rs`'s
# `native_clipboard_sink`): the webview cannot write the clipboard itself —
# WKWebView's custom-scheme pages have no `navigator.clipboard` — so writes
# arrive over the embedded helm's `POST /api/clipboard` and land here.
# Optional and desktop-feature-gated: the web build and the plain library
# have no pasteboard to write.
arboard = { workspace = true, optional = true }
farhelm-helm.workspace = true
farhelm-supervisor.workspace = true
# Content types for the desktop asset handler (`desktop::serve_asset`, D6).
# The same crate `farhelm-helm` uses for the embedded tree it serves over
# HTTP, on purpose: the native window and a browser must see the same type
# for the same file, and two guessers would be two chances to disagree.
mime_guess.workspace = true
# Decodes an asset path before it is looked up in the embedded tree, for the
# same reason `farhelm-helm`'s `serve_embedded_get` does: a file whose name
# needs escaping in a URL must still resolve to the entry `include_dir!`
# compiled in under its real name. Transitively present already, but a
# transitive crate cannot be imported.
percent-encoding.workspace = true
# Non-wasm half of the list-view and session-detail poll sleep (src/list.rs,
# src/session_view.rs). Not a new runtime dependency in practice:
# `dioxus-desktop` already constructs and drives a multi-thread tokio
# runtime for the desktop target, so this crate merely needs the `time`
# feature (already enabled workspace-wide) to schedule a sleep on it.
tokio.workspace = true
# Mints the client-side random identifiers on desktop — the create
# idempotency key and the session view's attachment lease (`mint_intent_key`
# and `mint_lease` in src/api.rs) — without going through a JS eval; see
# `mint_lease`'s docs for why. Target-specific rather than a plain
# dependency so wasm keeps using `crypto.randomUUID()` instead of pulling in
# an RNG it doesn't need.
uuid.workspace = true
# `tracing` macros used by the embedded helm's forwarded webview console
# events (`farhelm-helm`'s `client_log.rs`) and by this crate's own eval-
# bridge watchdog (`webview_watchdog.rs`) — both run IN this binary's own
# process on desktop, not in a spawned `farhelm helm run`/`supervisor run`
# subprocess, which is why `main.rs` installs its own subscriber below
# rather than relying on `crates/farhelm`'s `init_tracing` (a different
# binary's `main`, never on this process's call stack).
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "dep:arboard"]

[dev-dependencies]
# Per-test tracing capture stays out of every shipped UI feature. The attribute
# owns an isolated dispatcher and, for async tests, a Tokio runtime.
farhelm-testtrace.workspace = true
tempfile.workspace = true
