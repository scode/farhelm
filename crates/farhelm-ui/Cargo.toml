[package]
name = "farhelm-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Dioxus UI, built for web (wasm) and desktop from one crate"

[dependencies]
dioxus.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Parses a launch command's argv the same way the supervisor does
# (`farhelm-supervisor`'s own profile-invocation validation), so the row's
# compact invocation badge (`list::row::compact_invocation`) derives its
# program basename and marker candidates from real shell-word splitting
# instead of a partial hand-rolled parser. Pure Rust with no OS glue, so it
# compiles to wasm exactly as this crate's web target needs.
shell-words.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `Performance` is added on top of the workspace features (which carry
# `Window`/`Location` for every crate that needs them): the browser's
# `performance.now()` is this target's only monotonic clock, and
# `api::WalkClock` needs one to bound a listing walk in TIME as well as in
# pages, rows and bytes. `std::time::Instant` panics on
# wasm32-unknown-unknown, which is why the clock is a `cfg` pair rather than
# one implementation.
web-sys = { workspace = true, features = ["Performance", "Storage"] }
# List-view and session-detail polling sleep (PLAN_M2.md step 7 / PLAN_M4.md
# item 6; `ListView` in src/list.rs, `SessionView` in src/session_view.rs,
# both sharing `POLL_INTERVAL_MS` from src/api.rs): `TimeoutFuture` wraps
# `setTimeout` for this one-shot sleep — see the workspace `Cargo.toml` entry
# for why the desktop target instead reuses `tokio::time::sleep`.
gloo-timers.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
farhelm-helm.workspace = true
farhelm-supervisor.workspace = true
# Non-wasm half of the list-view and session-detail poll sleep (src/list.rs,
# src/session_view.rs). Not a new runtime dependency in practice:
# `dioxus-desktop` already constructs and drives a multi-thread tokio
# runtime for the desktop target, so this crate merely needs the `time`
# feature (already enabled workspace-wide) to schedule a sleep on it.
tokio.workspace = true
# Mints the client-side random identifiers on desktop — the create
# idempotency key and the session view's attachment lease (`mint_intent_key`
# and `mint_lease` in src/api.rs) — without going through a JS eval; see
# `mint_lease`'s docs for why. Target-specific rather than a plain
# dependency so wasm keeps using `crypto.randomUUID()` instead of pulling in
# an RNG it doesn't need.
uuid.workspace = true
# `tracing` macros used by the embedded helm's forwarded webview console
# events (`farhelm-helm`'s `client_log.rs`) and by this crate's own eval-
# bridge watchdog (`webview_watchdog.rs`) — both run IN this binary's own
# process on desktop, not in a spawned `farhelm helm run`/`supervisor run`
# subprocess, which is why `main.rs` installs its own subscriber below
# rather than relying on `crates/farhelm`'s `init_tracing` (a different
# binary's `main`, never on this process's call stack).
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dev-dependencies]
tempfile.workspace = true
