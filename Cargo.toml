[workspace]
resolver = "3"
members = [
  "crates/farhelm",
  "crates/farhelm-desktop",
  "crates/farhelm-helm",
  "crates/farhelm-proto",
  "crates/farhelm-supervisor",
  "crates/farhelm-teststate",
  "crates/farhelm-testtrace",
  "crates/farhelm-testtrace-macros",
  "crates/farhelm-ui",
]
# Application and ordinary library members, excluding `farhelm-desktop`, so that a bare `cargo
# build`/`test`/`clippy --all-targets` — the workspace checks CLAUDE.md's
# "Finishing work" list runs on every change, and CI runs on an ordinary
# runner — never compiles WebKit. `farhelm-desktop` unconditionally enables
# `farhelm-ui`'s `desktop` feature, which pulls in wry and needs the
# webkit2gtk/gtk development packages; only the `desktop` CI job installs
# them, and that job reaches the crate through an explicit `-p
# farhelm-desktop`.
#
# The cost of this line is that `-p farhelm-desktop` is the ONLY way the
# crate gets compiled: nothing in the default battery will notice it break.
# That is what the `desktop` job's `cargo check -p farhelm-desktop` step is
# for, and why it is not optional.
#
# The tracing support crates are also selected explicitly for their own checks. Selecting them
# as normal build roots would unify their Tokio test-util feature into application builds;
# consumers must reach that support through dev-dependencies only.
default-members = [
  "crates/farhelm",
  "crates/farhelm-helm",
  "crates/farhelm-proto",
  "crates/farhelm-supervisor",
  "crates/farhelm-teststate",
  "crates/farhelm-ui",
]

# Shared package metadata. One version number across the workspace is a
# SPEC_impl.md decision: the protocol hello carries it, and version skew is
# handled at the edges rather than per-crate.
#
# ## This number is a SKEW GUARD, not a release label
#
# It is the build stamp the helm puts on every reply and the browser bundle
# compares against its own (farhelm-ui's `skew` module). That comparison is
# EXACT equality, which means the guard only works if the number actually
# MOVES: two builds that share a version are indistinguishable to it, and a
# stale tab open across an upgrade gets no reload prompt and keeps its
# unattended behaviors — the silent degradation SPEC.md forbids, produced
# by the very mechanism meant to prevent it.
#
# So any change to the vocabulary a bundle and a helm must agree on MUST
# move this number, whether or not anything is being released. 0.0.3 is
# PLAN_M7.md item 2's `PROTOCOL_VERSION` 11: restricted-peer attribution,
# archive messages, and `Unauthorized` all change what an older peer can
# safely understand, so the browser-edge stamp moves with the wire bump.
#
# The helm↔supervisor edge does NOT rely on this: it has a real handshake
# (`PROTOCOL_VERSION`) and refuses at connect. This number is what stands in
# for that handshake on the browser edge, which has none.
[workspace.package]
version = "0.5.0-rc.2"
edition = "2024"
# cargo-dist reads `repository` to know where to cut releases, and warns
# without a `homepage` because the (deferred) Homebrew formula renders one.
# The project has no site of its own, so both point at the repository.
homepage = "https://github.com/scode/farhelm"
license = "MIT"
repository = "https://github.com/scode/farhelm"

# Shared dependency versions. Pinned here so every crate agrees; SPEC_impl.md
# calls for workspace-level pinning of churn-prone dependencies (Dioxus in
# particular).
[workspace.dependencies]
anyhow = "1"
# The desktop shell's native system-clipboard writer — the receiving end of
# `POST /api/clipboard` (farhelm-helm's clipboard.rs; the webview's own
# clipboard API does not exist on WKWebView's custom-scheme pages).
# default-features = false drops the image-data half and its `image`
# dependency tree: only text ever crosses this seam.
arboard = { version = "3.6", default-features = false }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
# Binary-to-text for credentials that travel inside text: the helm's web
# token and device-cookie handling (farhelm-helm's auth) and the
# supervisor's stored session bearer tokens (farhelm-supervisor's store).
# (It once also encoded the session list's pagination cursors; the list is
# served whole now and there are none.)
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
# Patch-pinned rather than "0.7": dx insists on a dioxus crate at its own
# exact version (a mismatch is a loud per-build ERROR), and CI installs dx at
# this same number — bump both together, plus scripts/desktop-smoke.sh's
# prerequisite note.
dioxus = "0.7.10"
# Decompresses a downloaded/staged release `.tar.gz` archive (D14) before
# `tar` reads the archive layer — the provisioning payload extractor
# (`provisioning/payloads.rs`) and the verified download source
# (`provisioning/release_payloads.rs`) share this one unpacking path.
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
# Browser bootstrap tokens and device cookies are credentials, not identifiers:
# both are minted directly from 128 bits of operating-system randomness.
getrandom = "0.3"
# List-view polling sleep on wasm32 (farhelm-ui's `ListView`): a thin
# `wasm-bindgen` binding to `setTimeout`, the only timer a browser tab
# actually has for this. Non-wasm32 targets use `tokio::time::sleep`
# instead — see farhelm-ui/Cargo.toml's target-dependency comment.
gloo-timers = { version = "0.3", features = ["futures"] }
# The web UI tree a release build compiles into `farhelm-helm`
# (`FARHELM_UI_DIST` at build time, D12) — see build.rs and
# `embedded_ui.rs`.
include_dir = "0.7"
# The `--ensure-hosts` file's format (PLAN_M6.md item 5). JSON5 rather than
# JSON because the file is hand-edited: comments and trailing commas are
# what make a checked-in fleet description survivable, and it is otherwise
# ordinary serde.
json5 = "1"
libc = "0.2"
# Content type for an embedded-UI asset response (`UiSource::Embedded`). A
# transitive dependency already, through tower-http's own `ServeDir` — but a
# transitive crate cannot be imported, so serving the embedded tree needs
# its own direct dependency on the same crate.
mime_guess = "2"
# Verifies a release's `SHA256SUMS.minisig` against the public key compiled
# into the binary (D3) — the whole trust anchor of download-based
# provisioning. A verify-only crate on purpose: nothing in farhelm ever
# signs, so the signing half of minisign stays out of the binary and out of
# the audit surface.
minisign-verify = "0.2"
# Decodes an embedded-UI request path (`UiSource::Embedded`) before it is
# looked up, classified by extension, or handed to `mime_guess` — a percent-
# escaped asset name (a literal space, say) must resolve to the same file an
# ordinary filesystem `ServeDir` would find. Already in `Cargo.lock`
# transitively (both `axum` and `tower-http` depend on it), but a transitive
# crate cannot be imported directly.
percent-encoding = "2"
# Feature set chosen by D3/plan Step 3, not by convenience. Two separate
# decisions that are easy to conflate:
#
# - BUNDLED webpki roots rather than the destination machine's trust store,
#   because one static binary is meant to run on any distro and a
#   minimal/container/embedded image may have no CA bundle installed, or one
#   in a location the binary would have to go looking for. Bundling makes the
#   trust set a property of the release instead of a property of wherever it
#   was copied to.
# - RUSTLS rather than native-tls, which is the separate reason `openssl-sys`
#   stays out of the release binary (`cargo tree -i openssl-sys` must stay
#   empty for `farhelm`) — OpenSSL is what makes a static musl link painful,
#   not the choice of root store.
# - NO `gzip`: the download source hashes response bytes exactly as they
#   arrive and compares them to `SHA256SUMS`, so transparent decompression
#   would hash something other than the signed artifact.
# - `stream` for the byte-at-a-time download loop (a release archive is tens
#   of megabytes; it is never buffered whole in memory).
# - `json` is not used by the download source at all — it is farhelm's and
#   farhelm-ui's, and stays for them.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-webpki-roots",
  "stream",
] }
# `bundled` compiles SQLite from source rather than linking the host's
# libsqlite3 — required for the musl-static supervisor artifacts
# SPEC_impl.md's cross-compilation plan ships (audited there: builds fine
# for both target triples under cargo-zigbuild).
rusqlite = { version = "0.40", features = ["bundled"] }
# Compares a payload-cache generation directory's version against this
# build's before deleting it recursively (`provisioning/release_payloads.rs`).
# A hand-rolled comparison got prereleases wrong in both directions — a
# `-rc.N` generation was never pruned, and an empty version parsed as a
# deletable one — and this predicate guards an `rm -rf` inside helm state, so
# it uses the real grammar. Already in `Cargo.lock` transitively; this only
# makes it a direct dependency.
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Device credentials are stored as fixed-size SHA-256 digests, and both those
# digests and the recoverable bootstrap token are compared without revealing
# a matching prefix through ordinary equality timing.
sha2 = "0.10"
shell-words = "1"
subtle = "2"
# Reads the single-member layout of a downloaded/staged release `.tar.gz`
# archive (D14) — paired with `flate2`, which handles the gzip layer
# underneath it. See that entry's comment for the shared extraction path.
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "net",
  "io-util",
  "io-std",
  "sync",
  "time",
  "fs",
] }
# Not linked by any runtime code — the supervisor renders its one TOML
# value by hand (`agent_kind::toml_basic_string`) rather than depending on
# a TOML writer for a single quoted string. This entry exists purely as a
# DEV-dependency, to round-trip-parse that hand-rendered output back in a
# test and prove it is valid TOML.
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Parses/validates `--release-base-url` (D2/D18) and builds the asset URLs
# the download payload source fetches from it.
url = "2"
uuid = { version = "1", features = ["v4"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }

farhelm-helm = { path = "crates/farhelm-helm" }
farhelm-proto = { path = "crates/farhelm-proto" }
farhelm-supervisor = { path = "crates/farhelm-supervisor" }
farhelm-teststate = { path = "crates/farhelm-teststate" }
farhelm-testtrace = { path = "crates/farhelm-testtrace" }
farhelm-testtrace-macros = { path = "crates/farhelm-testtrace-macros" }
# Only `farhelm-desktop` depends on this, and only with the `desktop`
# feature on — see that crate's Cargo.toml and the `default-members` note
# above for why the dependency is deliberately unreachable from the default
# workspace battery.
farhelm-ui = { path = "crates/farhelm-ui" }

# `wasm-release` is the cargo profile dx compiles the web UI under; this
# stanza merges into dx's own definition of it. The strip exists because
# rustc's precompiled wasm32 std ships DWARF debug sections (~1.4 MB in our
# module even though release builds compile our own code without debug
# info), and dx then feeds the module to Binaryen's wasm-opt, whose DWARF
# parser lags rustc's DWARF version and aborts with SIGABRT ("compile unit
# size was incorrect"). dx treats that abort as a soft failure — the build
# logs an ERROR and ships the UNOPTIMIZED wasm — so until this strip, every
# release quietly skipped wasm-opt. Nothing consumes that DWARF in the
# browser; stripping it at link time keeps wasm-opt actually running.
# Scoped to dx's profile on purpose: native binaries keep their debug info.
[profile.wasm-release]
inherits = "release"
strip = "debuginfo"

# The profile that 'dist' will build with
#
# Written by `dist init`, and used for the CARGO-built release artifact only —
# that is, `farhelm` on all three targets. `farhelm-desktop` does not come
# through cargo-dist's cargo build at all: it is a generic dist package whose
# build command runs `dx build --release`, so it links under Cargo's ordinary
# `release` profile. A change here (LTO, stripping, panic strategy) therefore
# moves one of the two shipped binaries and not the other; make it in both
# places, or say why not.
#
# Thin LTO is dist's own default rather than a measured choice of ours.
[profile.dist]
inherits = "release"
lto = "thin"
