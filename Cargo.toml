[workspace]
resolver = "3"
members = [
  "crates/farhelm",
  "crates/farhelm-helm",
  "crates/farhelm-proto",
  "crates/farhelm-supervisor",
  "crates/farhelm-ui",
]

# Shared package metadata. One version number across the workspace is a
# SPEC_impl.md decision: the protocol hello carries it, and version skew is
# handled at the edges rather than per-crate.
#
# ## This number is a SKEW GUARD, not a release label
#
# It is the build stamp the helm puts on every reply and the browser bundle
# compares against its own (farhelm-ui's `skew` module). That comparison is
# EXACT equality, which means the guard only works if the number actually
# MOVES: two builds that share a version are indistinguishable to it, and a
# stale tab open across an upgrade gets no reload prompt and keeps its
# unattended behaviors — the silent degradation SPEC.md forbids, produced
# by the very mechanism meant to prevent it.
#
# So any change to the vocabulary a bundle and a helm must agree on MUST
# move this number, whether or not anything is being released. 0.0.3 is
# PLAN_M7.md item 2's `PROTOCOL_VERSION` 11: restricted-peer attribution,
# archive messages, and `Unauthorized` all change what an older peer can
# safely understand, so the browser-edge stamp moves with the wire bump.
#
# The helm↔supervisor edge does NOT rely on this: it has a real handshake
# (`PROTOCOL_VERSION`) and refuses at connect. This number is what stands in
# for that handshake on the browser edge, which has none.
[workspace.package]
version = "0.0.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/scode/farhelm"

# Shared dependency versions. Pinned here so every crate agrees; SPEC_impl.md
# calls for workspace-level pinning of churn-prone dependencies (Dioxus in
# particular).
[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
# Opaque encoding for both pagination cursors — the `ListSessions` wire
# cursor (farhelm-supervisor's `service::core`, PLAN_M6.md item 2) and the
# helm's own REST cursor over the merged multi-host order
# (farhelm-helm's `aggregate`, PLAN_M6.md item 5). URL-safe so a cursor
# cannot break a caller that happens to embed it in a URL — which the REST
# layer's callers genuinely do, since the helm's cursor travels as a query
# parameter.
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dioxus = "0.7.0"
futures-util = { version = "0.3", default-features = false }
# Browser bootstrap tokens and device cookies are credentials, not identifiers:
# both are minted directly from 128 bits of operating-system randomness.
getrandom = "0.3"
# List-view polling sleep on wasm32 (farhelm-ui's `ListView`): a thin
# `wasm-bindgen` binding to `setTimeout`, the only timer a browser tab
# actually has for this. Non-wasm32 targets use `tokio::time::sleep`
# instead — see farhelm-ui/Cargo.toml's target-dependency comment.
gloo-timers = { version = "0.3", features = ["futures"] }
# The `--ensure-hosts` file's format (PLAN_M6.md item 5). JSON5 rather than
# JSON because the file is hand-edited: comments and trailing commas are
# what make a checked-in fleet description survivable, and it is otherwise
# ordinary serde.
json5 = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# `bundled` compiles SQLite from source rather than linking the host's
# libsqlite3 — required for the musl-static supervisor artifacts
# SPEC_impl.md's cross-compilation plan ships (audited there: builds fine
# for both target triples under cargo-zigbuild).
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Device credentials are stored as fixed-size SHA-256 digests, and both those
# digests and the recoverable bootstrap token are compared without revealing
# a matching prefix through ordinary equality timing.
sha2 = "0.10"
shell-words = "1"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "io-util", "io-std", "sync", "time", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }

farhelm-helm = { path = "crates/farhelm-helm" }
farhelm-proto = { path = "crates/farhelm-proto" }
farhelm-supervisor = { path = "crates/farhelm-supervisor" }
