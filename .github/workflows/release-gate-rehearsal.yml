# GENERATED THROWAWAY: release-gate rehearsal derived from release.yml by a local script.
# Never merge. Runs the per-target release build job (including the spliced test gate) on a
# branch push, with dist in plan/upload mode, so nothing is published.
# This file was autogenerated by dist: https://axodotdev.github.io/cargo-dist
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release gate rehearsal
permissions:
  "contents": "read"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  push:
    branches:
      - 'rehearsal/release-gate'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-latest"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ''
      tag-flag: ''
      publishing: 'false'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist plan --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: "Lint the changelog layout (tag-independent half of the release assertion)"
        run: python3 releasing/check-changelog.py format
      - name: "Free unused image toolchains before native desktop gates"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/share/miniconda
          df -h /
      - name: "Install pinned tmux build dependencies"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: "sudo apt-get update && sudo apt-get install -y python3-venv"
      - name: "Build pinned tmux"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: "scripts/build-pinned-tmux-ci.sh"
      - name: "Provision passwordless ssh to localhost"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: |
          sudo apt-get install -y openssh-server
          sudo systemctl enable --now ssh || sudo service ssh start
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          # `from=` restricts this passphrase-less key to loopback, which is the
          # only place anything uses it.
          printf 'from="127.0.0.1,::1" ' >> ~/.ssh/authorized_keys
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          # BatchMode makes an unknown host key a hard failure rather than a
          # prompt, so known_hosts has to be seeded before anything dials.
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
          # Fail here, loudly, rather than letting the test fall back to its skip
          # and report green on coverage that never ran.
          ssh -o BatchMode=yes localhost true
      - name: "Select Python with non-reaping child observation on macOS"
        uses: "actions/setup-python@v7"
        if: "runner.os == 'macOS'"
        with:
          "python-version": "3.13"
      - name: "Install the pinned test runner"
        if: "runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'X64')"
        run: |
          nextest_dir=$(python3 scripts/install-pinned-nextest.py --output-root "$RUNNER_TEMP/nextest-tools") || exit 1
          printf '%s\n' "$nextest_dir" >> "$GITHUB_PATH"
      - name: "Run the test suite against the pinned tmux"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: |
          PATH="$PWD/.ci-tmux:$PATH" python3 scripts/record-test-run.py \
            --runner nextest --kind release --selection 'workspace except farhelm and farhelm-desktop' \
            --concurrency '4 nextest slots across binaries; retries 0' --tmux required \
            --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run --workspace --exclude farhelm --exclude farhelm-desktop
          PATH="$PWD/.ci-tmux:$PATH" python3 scripts/record-test-run.py \
            --runner nextest --kind release --selection 'farhelm binary unit tests' \
            --concurrency '4 nextest slots; retries 0' --tmux required --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run -p farhelm --bins
          PATH="$PWD/.ci-tmux:$PATH" python3 scripts/record-test-run.py \
            --kind release --selection 'workspace doctests except farhelm and farhelm-desktop' \
            --concurrency '4 doctest threads' --tmux required --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo test --locked --doc --workspace --exclude farhelm --exclude farhelm-desktop -- --show-output --test-threads=4
      - name: "Regress safe output-client teardown on the pinned tmux"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: |
          PATH="$PWD/.ci-tmux:$PATH" scripts/test-tmux-pinned-shutdown.sh \
            --kind release --output-root "$RUNNER_TEMP/test-run-evidence"
      - name: "Run the JS unit harness"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: |
          cd crates/farhelm-ui/js-tests
          python3 "$GITHUB_WORKSPACE/scripts/record-test-run.py" \
            --kind release --selection 'asset JavaScript unit harness' --concurrency 'node default discovery' \
            --tmux none --output-root "$RUNNER_TEMP/test-run-evidence" -- node --test
      - name: "Run the OMP reporter asset scenarios"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: |
          cd crates/farhelm-supervisor/asset-js-tests
          python3 "$GITHUB_WORKSPACE/scripts/record-test-run.py" \
            --kind release --selection 'OMP reporter asset scenarios' --concurrency 'node default discovery' \
            --tmux none --output-root "$RUNNER_TEMP/test-run-evidence" -- node --test
      - name: "Provision a CentOS Stream 9 host over ssh"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools python3-venv
          PATH="$PWD/.ci-tmux:$PATH" python3 scripts/record-test-run.py \
            --kind release --selection 'CentOS provisioning fixture' --concurrency 'one selected test' \
            --tmux required --output-root "$RUNNER_TEMP/test-run-evidence" -- scripts/test-provision-centos.sh \
            --kind release --output-root "$RUNNER_TEMP/test-run-evidence"
      - name: "Compile the CLI half of the Mac release"
        if: "runner.os == 'macOS'"
        run: "cargo build -p farhelm --locked"
      - name: "Validate standalone uninstall on macOS"
        if: "runner.os == 'macOS'"
        run: |
          python3 scripts/record-test-run.py \
            --runner nextest --kind release --selection 'macOS uninstall unit tests' --concurrency '4 nextest slots; retries 0' \
            --tmux none --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run -p farhelm --bin farhelm -E 'test(uninstall::)'
          python3 scripts/record-test-run.py \
            --kind release --selection 'macOS installed uninstall acceptance' --concurrency 'one fixture at a time' \
            --tmux none --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- python3 scripts/test-uninstall.py --binary target/debug/farhelm --installer scripts/install.sh
      - name: "Compile and test the window half of the Mac release"
        if: "runner.os == 'macOS'"
        run: |
          python3 scripts/record-test-run.py \
            --runner nextest --kind release --selection 'macOS desktop unit tests' --concurrency '4 nextest slots; retries 0' \
            --tmux none --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run -p farhelm-ui --features desktop
          python3 scripts/record-test-run.py \
            --kind release --selection 'macOS desktop doctests' --concurrency '4 doctest threads' \
            --tmux none --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo test --locked --doc -p farhelm-ui --features desktop -- --show-output --test-threads=4
      - name: "Install the wasm target for the web bundle"
        run: "rustup target add wasm32-unknown-unknown"
      - name: "Install musl build tools"
        if: "runner.os == 'Linux'"
        run: "sudo apt-get update && sudo apt-get install -y musl-tools"
      - name: "Install the pinned Dioxus CLI"
        run: "cargo install --locked dioxus-cli --version 0.7.10"
      - name: "Install native desktop smoke dependencies"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool openbox imagemagick curl python3 libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
          sudo apt-get purge -y xdg-desktop-portal xdg-desktop-portal-gtk
      - name: "Test the native desktop seams"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: |
          python3 scripts/record-test-run.py \
            --runner nextest --kind release --selection 'Linux desktop unit tests' --concurrency '4 nextest slots; retries 0' \
            --tmux none --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run -p farhelm-ui --features desktop
          python3 scripts/record-test-run.py \
            --kind release --selection 'Linux desktop doctests' --concurrency '4 doctest threads' \
            --tmux none --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo test --locked --doc -p farhelm-ui --features desktop -- --show-output --test-threads=4
      - name: "Run the native desktop smoke gate"
        if: "runner.os == 'Linux' && runner.arch == 'X64'"
        run: |
          PATH="$PWD/.ci-tmux:$PATH" python3 scripts/record-test-run.py \
            --kind release --selection 'native desktop smoke legs' --concurrency 'sequential smoke legs' \
            --tmux required --output-root "$RUNNER_TEMP/test-run-evidence" -- scripts/desktop-smoke.sh
          rm -rf -- "$CARGO_TARGET_DIR"
        env:
          "CARGO_TARGET_DIR": "${{ runner.temp }}/desktop-smoke-target"
          "CI": true
          "DESKTOP_SMOKE_DIR": "${{ runner.temp }}/desktop-smoke"
      - name: "Collect native desktop smoke failure evidence"
        if: "failure() && runner.os == 'Linux' && runner.arch == 'X64'"
        run: |
          evidence_dir="$RUNNER_TEMP/desktop-smoke-evidence"
          mkdir -p "$evidence_dir"
          for evidence in "$RUNNER_TEMP"/desktop-smoke/*.log "$RUNNER_TEMP"/desktop-smoke/*.png "$RUNNER_TEMP"/desktop-smoke/*.txt \
            "$RUNNER_TEMP"/desktop-smoke/tmux-preflight-missing.stderr \
            "$RUNNER_TEMP"/desktop-smoke/tmux-preflight-belowfloor.stderr \
            "$RUNNER_TEMP"/desktop-smoke/pf-bogus-state.stderr; do
            if [ -f "$evidence" ] && [ ! -L "$evidence" ]; then
              cp -- "$evidence" "$evidence_dir/"
            fi
          done
      - name: "Upload native desktop smoke failure evidence"
        uses: "actions/upload-artifact@v4"
        if: "failure() && runner.os == 'Linux' && runner.arch == 'X64'"
        with:
          "if-no-files-found": "warn"
          "name": "desktop-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": "${{ runner.temp }}/desktop-smoke-evidence"
      - name: "Collect test run failure evidence"
        if: "failure() && (runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'X64'))"
        run: |
          evidence_dir="$RUNNER_TEMP/test-run-failure-evidence"
          mkdir -p "$evidence_dir"
          for run_dir in "$RUNNER_TEMP"/test-run-evidence/*; do
            [ -d "$run_dir" ] && [ ! -L "$run_dir" ] || continue
            run_id="${run_dir##*/}"
            [[ "$run_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || continue
            mkdir -p "$evidence_dir/$run_id"
            for evidence in "$run_dir/manifest.json" "$run_dir/output-head.log" "$run_dir"/output-tail-*.log; do
              if [ -f "$evidence" ] && [ ! -L "$evidence" ]; then
                cp -- "$evidence" "$evidence_dir/$run_id/"
              fi
            done
            # Keep fixed runner inputs and raw JUnit bytes through a bounded
            # collector; missing, oversized or unreadable files remain explicit.
            if [ -e "$run_dir/nextest.toml" ] || [ -e "$run_dir/nextest" ]; then
              python3 scripts/test_run_nextest.py "$run_dir" "$evidence_dir/$run_id" \
                > "$evidence_dir/$run_id/nextest-collection.json"
            fi
            # Export through the fixed-layout collector even if the recorder died
            # before building its own archive. Never recursively upload raw state.
            if [ -d "$run_dir/test-traces" ] && [ ! -L "$run_dir/test-traces" ]; then
              python3 scripts/test_run_traces.py "$run_dir/test-traces" \
                "$evidence_dir/$run_id/recovered-traces.tar" > "$evidence_dir/$run_id/trace-collection.json"
            fi
          done
      - name: "Upload test run failure evidence"
        uses: "actions/upload-artifact@v4"
        if: "failure() && (runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'X64'))"
        with:
          "if-no-files-found": "warn"
          "name": "test-run-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}"
          "path": "${{ runner.temp }}/test-run-failure-evidence"
      - name: "Let the toolchain's rust-objcopy find libLLVM on macOS"
        if: "runner.os == 'macOS'"
        run: |
          sysroot=$(rustc --print sysroot)
          for target_dir in "$sysroot"/lib/rustlib/*-apple-darwin; do
            if [ -x "$target_dir/bin/rust-objcopy" ] && [ ! -e "$target_dir/lib/libLLVM.dylib" ] && [ -e "$sysroot/lib/libLLVM.dylib" ]; then
              mkdir -p "$target_dir/lib"
              ln -s "$sysroot/lib/libLLVM.dylib" "$target_dir/lib/libLLVM.dylib"
              echo "linked libLLVM.dylib into $target_dir/lib"
            fi
          done
          "$sysroot"/lib/rustlib/aarch64-apple-darwin/bin/rust-objcopy --version
      - name: "Build the web bundle"
        run: |
          rm -rf target/dx
          cd crates/farhelm-ui && dx build --package farhelm-ui --platform web --release
      - name: "Point the release build at the web bundle"
        run: "echo \"FARHELM_UI_DIST=$GITHUB_WORKSPACE/target/dx/farhelm-ui/release/web/public\" >> \"$GITHUB_ENV\""
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
