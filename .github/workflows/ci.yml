# CI baseline per the project's modernize conventions: formatting, lint,
# tests, and doc formatting run as SEPARATE jobs so failures report in
# parallel and triage is one glance. Jobs that compile Rust (clippy, test)
# carry explicit cargo caching with job-scoped keys; the toolchain action's
# built-in cache is disabled everywhere so exactly one caching layer exists,
# and its implicit RUSTFLAGS are cleared so these commands behave
# identically in CI and locally. AGENTS.md's finish-work commands must
# match these invocations exactly — change one, change both.
#
# Non-GitHub-owned actions are pinned to commit SHAs (tag in comment):
# mutable tags would let an upstream compromise run arbitrary code with
# this repo's token.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt
          cache: false
          rustflags: ""
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
          cache: false
          rustflags: ""
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      # The integration tests drive a real tmux server; without this they
      # fail here rather than exercising the substrate they exist to pin.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # `--show-output` is load-bearing, not verbosity: the tests that can
      # only run where a systemd user manager exists announce their own skip
      # on this runner (which has none), and libtest swallows a passing
      # test's output without it — so the cgroup coverage would silently
      # read as "ran and passed" instead of "skipped, here is why".
      - run: cargo test -- --show-output

  # The desktop renderer is compiled by no other job: clippy/test build
  # with no renderer feature and e2e builds only the web one, so without
  # this the desktop target rots silently (it shipped in M1 having never
  # been compiled once).
  # `cargo check` rather than a full build: the point is "still compiles
  # against wry/gtk", and linking a webview binary CI never runs would
  # only slow the signal down.
  desktop:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      # The -sys crates in the desktop dependency tree (gtk-sys,
      # webkit2gtk-sys and friends) resolve their C libraries through
      # pkg-config at build-script time; these packages are the minimal
      # additions the CI image needs for the check to pass.
      - name: Install desktop system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: cargo check -p farhelm-ui --features desktop

  dprint:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting with dprint
        uses: dprint/check@9cb3a2b17a8e606d37aae341e49df3654933fc23 # v2.3

  # End-to-end: Playwright drives the web build in headless Chromium
  # against a real helm + supervisor + private tmux + fake agent. This is
  # the agents-verify-the-GUI-without-a-human path (PLAN_M1.md), so it is
  # a first-class CI job, not an optional extra.
  e2e:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
          cache: false
          rustflags: ""
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # Pinned by version and verified by checksum: this unpacks an
      # executable onto PATH and runs it, so a mutable `latest` URL would
      # be a weaker link than the SHA-pinned actions above.
      - name: Install dioxus-cli
        env:
          BINSTALL_VERSION: v1.21.1
          BINSTALL_SHA256: 630c8f8803a686aa6779497f0f0fb51d49822fb5fc3c514d8ced33b34e338e6e
        run: |
          set -euo pipefail
          url="https://github.com/cargo-bins/cargo-binstall/releases/download/${BINSTALL_VERSION}/cargo-binstall-x86_64-unknown-linux-musl.tgz"
          curl -sSfL "$url" -o /tmp/cargo-binstall.tgz
          echo "${BINSTALL_SHA256}  /tmp/cargo-binstall.tgz" | sha256sum -c -
          tar xzf /tmp/cargo-binstall.tgz -C ~/.cargo/bin/
          cargo binstall -y dioxus-cli@0.7.9
      - run: cargo build
      - name: Build web UI
        run: cd crates/farhelm-ui && dx build --platform web --release
      - name: Install Playwright
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: cd e2e && npx playwright test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
