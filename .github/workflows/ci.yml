# CI baseline: formatting, lint, desktop compilation, installer validation,
# the dependency license and source policy, and generated-workflow checks run
# as separate jobs so failures report in parallel and triage is one glance. The Rust jobs that need it carry explicit
# cargo caching with job-scoped keys; the toolchain action's
# built-in cache is disabled everywhere so exactly one caching layer exists,
# and its implicit warning enforcement (RUSTFLAGS, and since v2 the
# CARGO_BUILD_WARNINGS its `build-warnings` input sets) is cleared so these
# commands behave identically in CI and locally. AGENTS.md's finish-work commands must
# match these invocations exactly — change one, change both.
# With no toolchain input, the pinned action reads rust-toolchain.toml.
# Job-specific targets below extend that pin rather than select another Rust.
#
# Non-GitHub-owned actions are pinned to commit SHAs (tag in comment):
# mutable tags would let an upstream compromise run arbitrary code with
# this repo's token.
name: CI

# Manual runs only. This workflow no longer fires on pushes to main or on
# pull requests (disabled 2026-09-12): the validation that decides whether a
# build ships is the gate inside every release build job
# (`.github/dist-build-setup.yml`, run from the tag), and the per-change
# checks here were being paid on every ready PR and every merge without
# anyone waiting on the verdict. The jobs are kept intact so that
# `gh workflow run ci.yml --ref <branch>` still runs the whole baseline on
# demand for any ref; the `changes` filter and the draft guards on the root
# jobs are retained, dormant, so re-enabling a `pull_request` trigger is a
# one-line change rather than a rewrite.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation suite
        type: choice
        default: baseline
        options:
          - baseline
          - uninstall-macos

permissions:
  contents: read

# One live run per ref. A stacked-PR workflow rewrites and re-pushes many
# branches at once, often while their previous runs are still going; without
# this, every superseded run keeps consuming runners to completion for a
# commit nothing will look at. The group keys on the ref, so a push to a PR
# branch cancels only that PR's earlier run, never a sibling's or main's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uninstall-macos:
    if: inputs.suite == 'uninstall-macos'
    # The same image the release's macOS build job uses (dist-workspace.toml).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-v2-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""
          build-warnings: ""
      - name: Install the pinned test runner
        run: |
          nextest_dir=$(python3 scripts/install-pinned-nextest.py --output-root "$RUNNER_TEMP/nextest-tools") || exit 1
          printf '%s\n' "$nextest_dir" >> "$GITHUB_PATH"
      - run: cargo build -p farhelm --locked
      - name: Validate installed uninstall on the native filesystem
        run: |
          python3 scripts/record-test-run.py \
            --runner nextest --kind development --selection 'macOS uninstall unit tests' --concurrency '4 nextest slots; retries 0' \
            --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run -p farhelm --bin farhelm -E 'test(uninstall::)'
          # Version locks, the installation lock and the session keeper rest on
          # macOS behavior Linux only approximates (flock on an APFS folder,
          # extended attributes, RENAME_EXCL, F_FULLFSYNC, kqueue NOTE_EXIT).
          python3 scripts/record-test-run.py \
            --runner nextest --kind development --selection 'macOS version and installation lock tests' --concurrency '4 nextest slots; retries 0' \
            --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run -p farhelm-supervisor --lib -E 'test(/installation::|version_lock::|session_hold::/)'
          python3 scripts/record-test-run.py \
            --runner nextest --kind development --selection 'macOS version-lock process tests' --concurrency '4 nextest slots; retries 0' \
            --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run -p farhelm --test session_hold --test version_lock_forwarder
          # The desktop app's record of its detached supervisor, and the stop
          # that acts on it, rest on macOS's process identity and executable
          # path reads (the `KERN_PROC_PID` sysctl and `proc_pidpath`), which
          # differ from Linux's procfs. So does the stop's check that a
          # process has finished exiting (`procs::finished_exiting`), which
          # on macOS rests on the zombie state alone.
          python3 scripts/record-test-run.py \
            --runner nextest --kind development --selection 'macOS managed supervisor record tests' --concurrency '4 nextest slots; retries 0' \
            --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run -p farhelm-supervisor --lib -E 'test(/managed_supervisor::|procs::tests::finished_exiting/)'
          python3 scripts/record-test-run.py \
            --kind development --selection 'macOS installed uninstall acceptance' --concurrency 'one fixture at a time' \
            --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- python3 scripts/test-uninstall.py --binary target/debug/farhelm --installer scripts/install.sh
      # The terminal host's real-pty tests: its pty, process and socket
      # behavior is what every later release relies on (its SPEC.md), and
      # macOS's pty and peer-credential calls differ from Linux's. A step of
      # its own, after the uninstall gate, so that a host failure can never
      # keep that gate from running; and it runs whatever the step before
      # did. The entry test checks that a host started through `farhelm
      # internal terminal-host` holds no version lock, which exist only in
      # the Mac app's layout. The spawning, client, discovery and cleanup
      # tests cover the supervisor's side on macOS: the 104-byte socket path
      # limit, the host started from the real `farhelm` (peer pid, `ps`-read
      # environment and command line), the client's peer pid
      # (`LOCAL_PEERPID`), its verified SIGTERM (macOS's process identity
      # and command-line reads) and its reading of refused connections,
      # discovery's judging of a killed host's socket, the test-state
      # cleanup, whose reading of refused connections differs on macOS too,
      # and `farhelm internal stop-terminal-hosts`, which rests on the client
      # and the verified SIGTERM.
      # The host terminal runtime's tests run with them: the child's pinning
      # reads macOS's process identity, and its real-host tests drive macOS's
      # pty.
      - name: macOS terminal host tests
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/record-test-run.py \
            --runner nextest --kind development --selection 'macOS terminal host tests' --concurrency '4 nextest slots; retries 0' \
            --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run -p terminal-host || status=1
          python3 scripts/record-test-run.py \
            --runner nextest --kind development --selection 'macOS terminal host entry test' --concurrency '4 nextest slots; retries 0' \
            --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run -p farhelm --test terminal_host_entry || status=1
          python3 scripts/record-test-run.py \
            --runner nextest --kind development --selection 'macOS terminal host spawning, client, runtime, discovery and cleanup' --concurrency '4 nextest slots; retries 0' \
            --output-root "$RUNNER_TEMP/test-run-evidence" \
            -- cargo nextest run -p farhelm-supervisor -p farhelm-teststate -p farhelm --lib --test terminal_host_spawn --test terminal_host_client --test terminal_host_stop --test terminal_host_registry --test terminal_host_runtime -E 'test(/^hosts::/) | binary(terminal_host_spawn) | binary(terminal_host_client) | binary(terminal_host_stop) | binary(terminal_host_registry) | binary(terminal_host_runtime)' || status=1
          exit "${status:-0}"
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: uninstall-macos-failure
          path: |
            ${{ runner.temp }}/test-run-evidence/**/manifest.json
            ${{ runner.temp }}/test-run-evidence/**/output-head.log
            ${{ runner.temp }}/test-run-evidence/**/output-tail-*.log
            ${{ runner.temp }}/test-run-evidence/**/junit.xml
            ${{ runner.temp }}/test-run-evidence/**/nextest.toml

  # Docs-only PRs skip the Rust jobs. Every job below except dprint (the
  # one check that actually covers markdown, and seconds long) gates on
  # this job's `code` output, so a PR that touches only the allowlist
  # under `docs_only` costs one checkout plus dprint instead of the full
  # compile-and-test fan-out. Two invariants keep this safe:
  #
  # - The allowlist is an ALLOWLIST. Anything it does not name — Cargo
  #   files, scripts/, this workflow — counts as code, so a new file
  #   type defaults to running everything rather than silently skipping.
  # - Branch protection requires no status check, and in particular no CI
  #   job. A skipped job is neutral on the merge button. If a
  #   CI job is ever made required, skipped runs will block merging and
  #   this gate needs an always-run aggregator job (one that succeeds on
  #   skipped upstreams) to sit behind the requirement instead.
  #
  # Pushes to main have no base to diff against and always run everything.
  changes:
    runs-on: ubicloud
    # Draft PRs run nothing (see the trigger comment at the top).
    if: inputs.suite != 'uninstall-macos' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base against the PR's target needs real history.
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/$BASE_REF" HEAD) || exit 1
          # A file outside the docs allowlist means the change is code.
          if git diff --name-only "$base" HEAD | grep -qvE '^(.*\.md|docs/.*|lore/.*|LICENSE.*|website/.*)$'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "docs-only change; skipping the Rust jobs"
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          cache: false
          rustflags: ""
          build-warnings: ""
      - run: cargo fmt --all -- --check
      # Parse test source in this existing lightweight job; no test binaries
      # are started by the sleep convention check.
      - name: Check test delay rationales
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/test-sleep-env"
          "$RUNNER_TEMP/test-sleep-env/bin/python" -m pip install --only-binary=:all: -r scripts/test-sleep-requirements.txt
          "$RUNNER_TEMP/test-sleep-env/bin/python" -B scripts/check-test-sleeps.py

  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # No restore-keys, for the reason the desktop job's cache spells
          # out: a stale target/ generation restored on a lockfile change
          # and saved together with the new one grows the entry until it
          # fills the runner's disk. The fallback survived here after that
          # incident (#255) and took the former Rust-test job down the same
          # way on 2026-09-02, the runner crashing during the RESTORE. The `-v2`
          # retires every entry the fallback grew; a lockfile change costs
          # one cold build.
          key: ${{ runner.os }}-cargo-${{ github.job }}-v2-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache: false
          rustflags: ""
          build-warnings: ""
      # The GPUI GUI crate is a default member, and GPUI's -sys crates find
      # fontconfig and xkbcommon through pkg-config at build-script time
      # (Wayland and Vulkan are loaded at run time and need nothing here).
      - name: Install GPUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libxkbcommon-dev
      - run: cargo clippy --all-targets -- -D warnings
      # Every ban in crates/gui/clippy.toml must still fire: clippy matches
      # banned paths by name, so a GPUI or GPUI Kit path that moved would
      # otherwise stop being enforced without any error. The script lints
      # crates/gui/lint-demo, which violates each ban on purpose, reusing
      # the build the step above left in target/.
      - name: Prove the GUI lint bans fire
        run: |
          python3 -B scripts/test-check-gui-lints.py
          python3 -B scripts/check-gui-lints.py
      # `--all-targets` builds the e2e tests, whose dev-dependency turns on the
      # supervisor's `test-seams` feature for the whole build. The shipped
      # binary builds without it, so lint that configuration separately:
      # `-p farhelm --bins` builds no dev-dependency.
      - run: cargo clippy -p farhelm --bins -- -D warnings
      # The OMP conversation-reporter asset's scenarios are the only
      # automated execution of an injected asset. They are milliseconds of
      # work, so they ride the lint runner rather than paying for a separate
      # job: node is already present on this runner image, and running from
      # inside the suite directory uses node's long-supported default test
      # discovery instead of glob CLI syntax from an unpinned node release.
      - run: cd crates/farhelm-supervisor/asset-js-tests && node --test

  # The desktop app (`farhelm-desktop`) is outside the workspace's default
  # members, so the clippy job never builds it and this job is the only
  # ordinary-CI lint of it, its tests included.
  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The `lint-v3` namespace retires the old Dioxus/WebKit compile
          # cache. No restore-keys: a stale generation restored on a lockfile
          # change and saved beside the new one previously filled the runner's
          # disk in the cache post-step (main, 2026-08-24).
          key: ${{ runner.os }}-cargo-${{ github.job }}-lint-v3-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache: false
          rustflags: ""
          build-warnings: ""
      # On Linux the app opens saved downloads through GIO, whose -sys
      # crates resolve GLib through pkg-config at build-script time.
      - name: Install desktop system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
      - run: cargo clippy -p farhelm-desktop --all-targets -- -D warnings

  # scripts/install.sh is the one file a fresh machine runs unread and
  # unreviewed (`curl | sh`), so a syntax slip or a shellcheck-catchable
  # bug in it gets its own job rather than waiting for a Rust-side asset-table
  # check that only compares names, not whether the script actually runs. The static
  # checks (sh -n, shellcheck) run first and are near-instant; the real
  # weight is test-install-sh.sh, which drives install.sh as a child
  # process against a real HTTP server serving synthetic release fixtures
  # — macOS-shaped download, checksum and archive verification,
  # replacement (including a forced-failure rollback), and the exact
  # closing-message contract, all without touching this runner's real
  # $HOME or $PATH.
  #
  # install.sh hands everything under the installation lock to the release's
  # own farhelm (`farhelm internal install`), so the harness needs this
  # tree's real binary. It is built static (musl) because the Alpine rerun
  # below cannot run a glibc binary, and one build then serves both runs.
  install-script:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v7
      # python3 backs test-install-sh.sh's fixture HTTP server (stdlib
      # only, no pip install needed); musl-tools builds rusqlite's bundled
      # SQLite for the static farhelm.
      - run: sudo apt-get install -y shellcheck python3 musl-tools
      - run: sh -n scripts/install.sh
      - run: shellcheck scripts/install.sh scripts/test-install-sh.sh
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-v1-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""
          build-warnings: ""
          target: x86_64-unknown-linux-musl
      - run: cargo build -p farhelm --target x86_64-unknown-linux-musl --locked
      - run: bash scripts/test-install-sh.sh --farhelm target/x86_64-unknown-linux-musl/debug/farhelm
      # The steps above run install.sh under Ubuntu's GNU userland (glibc
      # tar/sed/awk/grep/sha256sum). A distro-decorated GNU option or output
      # format the script accidentally depended on would pass every one of
      # them and still break on a genuinely different one — musl libc,
      # BusyBox ash as /bin/sh, and BusyBox's own tar/sed/awk/grep/sha256sum
      # (not GNU ones reinstalled over them, which would defeat the point).
      # curl, bash (the harness itself is bash, not sh — see
      # test-install-sh.sh's own docstring), and python3 (the fixture
      # server) are the only things missing from a bare `alpine:3` image
      # entirely; perl-utils and openssl exist there only to give the
      # harness's own sha256sum/shasum/openssl fallback coverage something
      # real to fall back to, not because install.sh itself needs them.
      # Confirmed empirically before landing this: install.sh needed no
      # changes at all to pass its full suite here. The uname shim now models
      # macOS: this checks shell/tool portability, not Linux installation.
      - name: Alpine/BusyBox portability check
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:3 sh -c '
            set -e
            apk add --no-cache curl bash python3 perl-utils openssl
            sh -n scripts/install.sh
            bash scripts/test-install-sh.sh --farhelm target/x86_64-unknown-linux-musl/debug/farhelm
          '

  # The docs website (website/, Astro + Starlight) builds here so a page with
  # broken frontmatter, a dangling sidebar slug, or a broken internal link
  # fails before Vercel's own build does. Like dprint it is independent of
  # the `changes` gate: a website-only change is in the docs allowlist and
  # skips the Rust jobs, while this job is seconds long and the one check
  # that covers it.
  website:
    runs-on: ubicloud
    # Draft PRs run nothing (see the trigger comment at the top).
    if: inputs.suite != 'uninstall-macos' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@v7
      # Bun installs the packages, but `astro build` runs under Node through
      # the astro binary's shebang, and Astro 7 refuses Node older than
      # 22.12. Pinning Node here keeps the build independent of whatever
      # the runner image happens to ship.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website
      # The feedback endpoint's handler tests ride this job because it is the
      # one that runs for website-only changes and already pins Node. Running
      # from inside the suite directory keeps node's default test discovery,
      # as the UI's JS harness does.
      - run: node --test
        working-directory: website/feedback-tests

  dprint:
    runs-on: ubicloud
    # Draft PRs run nothing (see the trigger comment at the top).
    if: inputs.suite != 'uninstall-macos' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting with dprint
        uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5
      # The agent instructions' structural check lives here rather than in
      # the formatting job because that job skips docs-only changes, and an
      # instruction change is exactly that. It keeps the root AGENTS.md under
      # the size Codex injects whole and every pointer resolvable; see the
      # script's docstring. Seconds, stdlib Python only.
      - name: Check agent instructions
        run: |
          python3 scripts/check-agents-md.py --self-test
          python3 scripts/check-agents-md.py

  # The dependency policy in deny.toml: every crate's license must be on its
  # allowlist (no GPL, AGPL or LGPL reaching the tree through some new
  # dependency) and every crate must come from crates.io, never git. Only
  # the licenses and sources checks run; the advisories check would fail on
  # RustSec entries that have nothing to do with a change. cargo-deny reads
  # the graph through `cargo metadata`, so the job needs the pinned toolchain
  # but compiles nothing, and the prebuilt binary keeps it to seconds.
  # `--locked` fails a Cargo.lock that does not match the manifests instead
  # of checking a graph cargo resolved on the fly.
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""
          build-warnings: ""
      - name: Install the pinned cargo-deny
        run: |
          deny_dir=$(python3 scripts/install-pinned-cargo-deny.py --output-root "$RUNNER_TEMP/cargo-deny-tools") || exit 1
          printf '%s\n' "$deny_dir" >> "$GITHUB_PATH"
      - run: cargo-deny --locked check licenses sources
      # GUI crates never depend on the helm, and framework-free GUI crates
      # never on GPUI (SPEC_impl.md, "GUI architecture"). Like cargo-deny it
      # only reads `cargo metadata`, so it shares this compile-free job.
      - name: Check the GUI crate layering
        run: |
          python3 -B scripts/test-check-crate-layering.py
          python3 -B scripts/check-crate-layering.py

  # release.yml is GENERATED by cargo-dist from dist-workspace.toml and the
  # steps spliced in from .github/dist-build-setup.yml, and dist refuses to
  # run a release whose generated file is stale — but only at tag time, in
  # the `plan` job, which is the worst moment to learn that a PR edited the
  # template without rerunning `dist init`. That happened once (the tag for
  # 0.1.1 died in `plan` after a CI-leg PR touched the template). This job
  # asks the same question on every push, with the same pinned dist the
  # release workflow installs, so the answer arrives while the PR is open.
  # Unconditional because the inputs are workflow files, which the
  # `changes` filter does not classify as code, and the check is seconds.
  dist-check:
    runs-on: ubicloud
    # Draft PRs run nothing (see the trigger comment at the top).
    if: inputs.suite != 'uninstall-macos' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned dist
        # The same installer line release.yml itself uses; `bash` for
        # pipefail so a failed download is a failure, not an empty script.
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Check release.yml is what dist would generate
        run: ~/.cargo/bin/dist generate --check
