# CI baseline per the project's modernize conventions: formatting, lint,
# tests, and doc formatting run as SEPARATE jobs so failures report in
# parallel and triage is one glance. Jobs that compile Rust (clippy, test)
# carry explicit cargo caching with job-scoped keys; the toolchain action's
# built-in cache is disabled everywhere so exactly one caching layer exists,
# and its implicit RUSTFLAGS are cleared so these commands behave
# identically in CI and locally. AGENTS.md's finish-work commands must
# match these invocations exactly — change one, change both.
#
# Non-GitHub-owned actions are pinned to commit SHAs (tag in comment):
# mutable tags would let an upstream compromise run arbitrary code with
# this repo's token.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Docs-only PRs skip the Rust jobs. Every job below except dprint (the
  # one check that actually covers markdown, and seconds long) gates on
  # this job's `code` output, so a PR that touches only the allowlist
  # under `docs_only` costs one checkout plus dprint instead of the full
  # compile-and-test fan-out. Two invariants keep this safe:
  #
  # - The allowlist is an ALLOWLIST. Anything it does not name — Cargo
  #   files, scripts/, e2e/, this workflow — counts as code, so a new file
  #   type defaults to running everything rather than silently skipping.
  # - Branch protection requires only `require-main-base` (pr-base.yml),
  #   never a CI job. A skipped job is neutral on the merge button. If a
  #   CI job is ever made required, skipped runs will block merging and
  #   this gate needs an always-run aggregator job (one that succeeds on
  #   skipped upstreams) to sit behind the requirement instead.
  #
  # Pushes to main have no base to diff against and always run everything.
  changes:
    runs-on: ubicloud
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base against the PR's target needs real history.
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/$BASE_REF" HEAD) || exit 1
          # A file outside the docs allowlist means the change is code.
          if git diff --name-only "$base" HEAD | grep -qvE '^(.*\.md|docs/.*|lore/.*|LICENSE.*)$'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "docs-only change; skipping the Rust jobs"
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt
          cache: false
          rustflags: ""
      - run: cargo fmt --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
          cache: false
          rustflags: ""
      - run: cargo clippy --all-targets -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      # The integration tests drive a real tmux server, and the one they
      # drive is the pinned release from source-pins.env — not the runner's
      # distro package, which sits below the version floor that lands later
      # in this stack (TODO.md's 2026-08-22 decision: the floor IS the
      # regression-tested version, so a suite run on anything else would
      # exercise a substrate the product refuses). The binary is built from
      # the release workflow's checksummed source pins (python3-venv is for
      # the zig toolchain that build needs) and cached. Every build input is
      # in the cache key — the key is the only thing that rolls the binary
      # when libevent, ncurses, zig, or the build script change; the build
      # script's own version assertion catches just the wrong tmux release.
      - name: Install pinned tmux build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-venv
      - name: Restore pinned tmux
        uses: actions/cache@v4
        with:
          path: .ci-tmux/tmux
          key: tmux-pinned-ci-${{ runner.os }}-${{ runner.arch }}-ziglang-0.14.1-${{ hashFiles('.github/release/source-pins.env', '.github/release/ziglang-requirements.txt', 'scripts/build-private-tmux.sh', 'scripts/build-pinned-tmux-ci.sh') }}
      - name: Build pinned tmux
        run: scripts/build-pinned-tmux-ci.sh
      # From M6 on, `ssh localhost` is a transport under test, not just a
      # deployment detail: the connection manager's ssh-row test dials a
      # real supervisor through the user's own ssh (PLAN_M6.md's testing
      # decisions). That test skips loudly where passwordless self-ssh is
      # unavailable — which is the right behavior on a developer's laptop
      # and exactly the wrong one here, where it would leave the whole ssh
      # path permanently uncovered while announcing so in output nobody
      # reads. Provisioning it makes the skip a local-only affordance.
      - name: Provision passwordless ssh to localhost
        run: |
          sudo apt-get install -y openssh-server
          sudo systemctl enable --now ssh || sudo service ssh start
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          # `from=` restricts this key to loopback. The runner is
          # short-lived and firewalled, so this is defense in depth rather
          # than a fix for a known exposure — but the key is passphrase-less
          # and lives beside a running sshd, and the only thing that ever
          # uses it dials localhost. A key that can only be used from where
          # it is meant to be used costs nothing and removes the whole
          # question.
          printf 'from="127.0.0.1,::1" ' >> ~/.ssh/authorized_keys
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          # BatchMode's refusal to prompt is what makes the ssh transport
          # usable unattended, and it also means an unknown host key is a
          # hard failure rather than a question — so known_hosts has to be
          # seeded before anything dials.
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
          # Fail the job here, loudly, rather than letting the test fall
          # back to its skip and report green on coverage that never ran.
          ssh -o BatchMode=yes localhost true
      # `--show-output` is load-bearing, not verbosity: the tests that can
      # only run where a systemd user manager exists announce their own skip
      # on this runner (which has none), and libtest swallows a passing
      # test's output without it — so the cgroup coverage would silently
      # read as "ran and passed" instead of "skipped, here is why".
      #
      # `--test-threads=4` matches the runner's vCPU count instead of
      # libtest's 16-thread default. The integration binaries spawn real
      # tmux servers and supervisors per test, so matching runnable tests to
      # available CPUs keeps process and memory pressure predictable. The
      # earlier "server exited unexpectedly" failures were later traced to
      # unsafe control-client teardown, not scheduler starvation; this cap is
      # retained as a resource bound rather than as that crash's workaround.
      #
      # PATH puts the pinned build first for this process tree only; the
      # supervisor resolves `tmux` through PATH, so this is the whole of how
      # the suite selects its substrate.
      - run: PATH="$PWD/.ci-tmux:$PATH" cargo test -- --show-output --test-threads=4
      # Still its own step after the full suite: each of these scenarios
      # gets a fresh test process so a surviving client or server cannot
      # contaminate the next, which the full suite's shared binaries cannot
      # offer.
      - name: Regress safe output-client teardown on the pinned tmux
        run: scripts/test-tmux-pinned-shutdown.sh
      # The JS unit harness (PLAN_M6_5.md item 1) rides in this job rather
      # than a new one: it is milliseconds of work, and a whole job's
      # scheduling overhead would dwarf it. Node is preinstalled on this
      # runner image (the e2e job below relies on the same fact for
      # Playwright), so this adds no new provisioning. Running from inside
      # js-tests/ rather than passing a glob from the repo root is
      # deliberate: this pins no node version, and node's default
      # no-argument discovery (every `*.test.js` in cwd) has worked since
      # the test runner shipped, while quoted-glob CLI arguments are a
      # newer addition an older-but-still-supported node would choke on.
      - run: cd crates/farhelm-ui/js-tests && node --test

  # The desktop renderer is compiled by no other job: clippy/test build
  # with no renderer feature and e2e builds only the web one, so without
  # this the desktop target rots silently (it shipped in M1 having never
  # been compiled once).
  # The check keeps the renderer compile gate explicit; the test command also
  # links and runs the desktop-feature unit seams that plain workspace tests
  # cannot see.
  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Deliberately no restore-keys: this job's target/ is large enough
          # (gtk-sys, webkit2gtk-sys, the Dioxus desktop renderer) that
          # restoring a stale generation on a lockfile change and then
          # saving old+new artifacts as a new entry filled the runner's disk
          # and crashed the runner in the cache post-step (main, 2026-08-24).
          # A lockfile change costs one cold build instead; the saved cache
          # then only ever holds a single generation of artifacts.
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          # The asset check below builds the web bundle, which is wasm.
          target: wasm32-unknown-unknown
          cache: false
          rustflags: ""
      # The -sys crates in the desktop dependency tree (gtk-sys,
      # webkit2gtk-sys and friends) resolve their C libraries through
      # pkg-config at build-script time; these packages are the minimal
      # additions the CI image needs for the check to pass.
      - name: Install desktop system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
          cargo install --locked dioxus-cli --version 0.7.10
      - run: cargo check -p farhelm-ui --features desktop
      - run: cargo test -p farhelm-ui --features desktop
      # `farhelm-desktop` is outside the workspace's default members, so no
      # ordinary workspace command compiles it and only this job touches it
      # at all. The asset step below also builds it, through dx — this one
      # stays because it fails in seconds with a compiler error rather than
      # minutes into a dx build, and because a type error here should not be
      # reported as an asset-gate failure.
      - run: cargo check -p farhelm-desktop
      # The Linux stand-in for the distribution plan's macOS asset gate: the
      # native window serves `/assets/*` from the embedded web bundle, and
      # nothing at compile time forces the desktop build's asset names and
      # that bundle's files to be the same set. See the script's header for
      # why it builds through dx rather than cargo.
      - run: scripts/check-desktop-assets.sh
      # Disk headroom is what this job has actually run out of; make it
      # visible in the log so the next occurrence is diagnosable.
      - run: df -h

  # The non-pixel phase boots the dx-built Linux desktop shell in place under
  # Xvfb — the same `desktop::run` the macOS release artifact calls, not that
  # artifact itself — and proves embedded-helm auth, the app-owned supervisor,
  # the FARHELM_TMUX override reaching it, every window asset going through
  # the desktop asset handler, hard-exit lifetime tethering, restart reuse,
  # and rotation recovery. The coordinate-driven terminal interaction remains
  # an optional local leg.
  desktop-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
          cache: false
          rustflags: ""
      - name: Install desktop smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool openbox imagemagick curl python3 python3-venv libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
          cargo install --locked dioxus-cli --version 0.7.10
      # Same pinned build as the test job, for the same reason: the managed
      # supervisor the desktop app spawns inherits this step's PATH, and it
      # must find the floor version there rather than the distro package.
      - name: Restore pinned tmux
        uses: actions/cache@v4
        with:
          path: .ci-tmux/tmux
          key: tmux-pinned-ci-${{ runner.os }}-${{ runner.arch }}-ziglang-0.14.1-${{ hashFiles('.github/release/source-pins.env', '.github/release/ziglang-requirements.txt', 'scripts/build-private-tmux.sh', 'scripts/build-pinned-tmux-ci.sh') }}
      - name: Build pinned tmux
        run: scripts/build-pinned-tmux-ci.sh
      # A pinned state-dir path (instead of the script's default mktemp)
      # exists solely so the failure artifact below has a stable path to
      # collect. The script refuses a pre-existing directory, which is
      # fine here: runner temp dirs start empty.
      - name: Run desktop integration gate
        env:
          CI: true
          DESKTOP_SMOKE_DIR: ${{ runner.temp }}/desktop-smoke
        run: PATH="$PWD/.ci-tmux:$PATH" scripts/desktop-smoke.sh
      # The script deliberately keeps its run dir when a phase fails — but
      # until this upload existed, that evidence died with the runner,
      # which is why the gate's rare CI-only failures (the clean-exit
      # flake of 2026-08-16/17) stayed undiagnosable. An explicit
      # allowlist rather than the whole directory, deliberately: the run dir
      # also holds unix sockets and the Xvfb display FIFO (non-regular files
      # the uploader cannot archive) and live credential material
      # (curl-auth.conf, desktop-client.json, helm.db) — none of it
      # evidence. The desktop/dx logs, the failure screenshot, and the
      # exit-leg state dump are.
      - name: Upload failure state
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-failure
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/desktop-smoke/*.log
            ${{ runner.temp }}/desktop-smoke/*.png
            ${{ runner.temp }}/desktop-smoke/*.txt

  # Provisioning accepts any Linux host with a usable systemd user manager,
  # but every provisioning integration test dials `localhost` — which on this
  # runner is Ubuntu. So the one scenario the old `ID=ubuntu` gate existed to
  # forbid, a helm installing a supervisor onto a DIFFERENT distribution, had
  # no coverage. GitHub hosts no non-Ubuntu Linux runner, so the script boots
  # a systemd CentOS Stream 9 container here and provisions it over ssh with
  # the release's own musl-static payloads. Its header carries the container
  # and payload rationale.
  #
  # Its own job, deliberately kept OUT of `test`: systemd inside Docker is the
  # least reliable thing in this workflow, and a bad day for it must not read
  # as the main suite going red.
  provision-centos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    # The script's own waits are all bounded, so anything that reaches this
    # limit is stuck somewhere it does not know it can be stuck.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # No restore-keys, for the reason the desktop job documents: this
          # job's target/ holds a musl payload build ON TOP of a host-triple
          # test build, so restoring a stale generation and then saving
          # old+new is exactly the shape that filled a runner's disk in the
          # cache post-step. A lockfile change costs one cold build instead.
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: x86_64-unknown-linux-musl
          cache: false
          rustflags: ""
      # musl-tools because rusqlite's `bundled` feature compiles SQLite from C
      # source, so the payload needs a musl-targeting C toolchain and not just
      # Rust std for the triple. python3-venv is for the zig toolchain the
      # pinned tmux build uses on a cache miss.
      - name: Install payload build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools python3-venv
      # Same cache entry as the test job's, deliberately: it is the same
      # binary from the same pins, and sharing it means only one job ever
      # pays for the build.
      - name: Restore pinned tmux
        uses: actions/cache@v4
        with:
          path: .ci-tmux/tmux
          key: tmux-pinned-ci-${{ runner.os }}-${{ runner.arch }}-ziglang-0.14.1-${{ hashFiles('.github/release/source-pins.env', '.github/release/ziglang-requirements.txt', 'scripts/build-private-tmux.sh', 'scripts/build-pinned-tmux-ci.sh') }}
      - run: scripts/test-provision-centos.sh
      # The container image and the musl payload together are a couple of
      # gigabytes; make the headroom visible in the log so the next
      # out-of-disk failure is diagnosable rather than mysterious.
      - run: df -h

  # scripts/install.sh is the one file a fresh machine runs unread and
  # unreviewed (`curl | sh`), so a syntax slip or a shellcheck-catchable
  # bug in it gets its own job rather than waiting to be noticed inside
  # the slower `test` job's Rust-side parity check (`assets.rs`'s
  # `install_sh_asset_table_matches_release_archives_exactly`, which only
  # checks the asset table, not that the script actually runs). The static
  # checks (sh -n, shellcheck) run first and are near-instant; the real
  # weight is test-install-sh.sh, which drives install.sh as a child
  # process against a real HTTP server serving synthetic release fixtures
  # — platform detection, download, checksum and archive verification,
  # replacement (including a forced-failure rollback), and the exact
  # closing-message contract, all without touching this runner's real
  # $HOME or $PATH.
  install-script:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      # python3 backs test-install-sh.sh's fixture HTTP server (stdlib
      # only, no pip install needed).
      - run: sudo apt-get install -y shellcheck python3
      - run: sh -n scripts/install.sh
      - run: shellcheck scripts/install.sh scripts/test-install-sh.sh
      - run: bash scripts/test-install-sh.sh
      # The steps above run install.sh under Ubuntu's GNU userland (glibc
      # tar/sed/awk/grep/sha256sum). A distro-decorated GNU option or output
      # format the script accidentally depended on would pass every one of
      # them and still break on a genuinely different one — musl libc,
      # BusyBox ash as /bin/sh, and BusyBox's own tar/sed/awk/grep/sha256sum
      # (not GNU ones reinstalled over them, which would defeat the point).
      # curl, bash (the harness itself is bash, not sh — see
      # test-install-sh.sh's own docstring), and python3 (the fixture
      # server) are the only things missing from a bare `alpine:3` image
      # entirely; perl-utils and openssl exist there only to give the
      # harness's own sha256sum/shasum/openssl fallback coverage something
      # real to fall back to, not because install.sh itself needs them.
      # Confirmed empirically before landing this: install.sh needed no
      # changes at all to pass its full suite here.
      - name: Alpine/BusyBox portability check
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:3 sh -c '
            set -e
            apk add --no-cache curl bash python3 perl-utils openssl
            sh -n scripts/install.sh
            bash scripts/test-install-sh.sh
          '

  dprint:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting with dprint
        uses: dprint/check@9cb3a2b17a8e606d37aae341e49df3654933fc23 # v2.3

  # release.yml is GENERATED by cargo-dist from dist-workspace.toml and the
  # steps spliced in from .github/dist-build-setup.yml, and dist refuses to
  # run a release whose generated file is stale — but only at tag time, in
  # the `plan` job, which is the worst moment to learn that a PR edited the
  # template without rerunning `dist init`. That happened once (the tag for
  # 0.1.1 died in `plan` after a CI-leg PR touched the template). This job
  # asks the same question on every push, with the same pinned dist the
  # release workflow installs, so the answer arrives while the PR is open.
  # Unconditional because the inputs are workflow files, which the
  # `changes` filter does not classify as code, and the check is seconds.
  dist-check:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned dist
        # The same installer line release.yml itself uses; `bash` for
        # pipefail so a failed download is a failure, not an empty script.
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Check release.yml is what dist would generate
        run: ~/.cargo/bin/dist generate --check

  # End-to-end: Playwright drives the web build against a real helm +
  # supervisor + private tmux + fake agent, in both headless Chromium and
  # WebKit. This is the agents-verify-the-GUI-without-a-human path
  # (PLAN_M1.md), so it is a first-class CI job, not an optional extra.
  # WebKit is included because it is the desktop app's actual engine
  # family (WKWebView on macOS, WebKitGTK on Linux): engine-level
  # behavior differences — rendering, input handling, JS API quirks —
  # are only observable under a WebKit run. It covers the web build in
  # that engine, NOT the desktop shell itself (a wry integration bug,
  # like the eval-channel death manual testing found on macOS, lives in
  # a layer no browser run exercises — that stays with the desktop
  # smoke harness and manual passes).
  e2e:
    # Disabled, not deleted: by far the slowest and most expensive job here,
    # and the same suite is a required local finish-work gate (see AGENTS.md),
    # so CI was paying for a rerun of something already run. Remove the `if`
    # to re-enable; the job is otherwise maintained and expected to work.
    if: false
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
          cache: false
          rustflags: ""
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # Same block as the test job's, and it must stay in sync: the fleet
      # start-stack.sh boots registers its second supervisor as an
      # ssh-to-localhost host, so the helm under test dials this runner's
      # own sshd. Without this, that host never connects and the fleet
      # tests fail (they refuse to skip in CI by design — a skipped fleet
      # would read as green coverage that never ran). The rationale for
      # each line lives on the test job's copy.
      - name: Provision passwordless ssh to localhost
        run: |
          sudo apt-get install -y openssh-server
          sudo systemctl enable --now ssh || sudo service ssh start
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          printf 'from="127.0.0.1,::1" ' >> ~/.ssh/authorized_keys
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost true
      # Pinned by version and verified by checksum: this unpacks an
      # executable onto PATH and runs it, so a mutable `latest` URL would
      # be a weaker link than the SHA-pinned actions above.
      - name: Install dioxus-cli
        env:
          BINSTALL_VERSION: v1.21.1
          BINSTALL_SHA256: 630c8f8803a686aa6779497f0f0fb51d49822fb5fc3c514d8ced33b34e338e6e
        run: |
          set -euo pipefail
          url="https://github.com/cargo-bins/cargo-binstall/releases/download/${BINSTALL_VERSION}/cargo-binstall-x86_64-unknown-linux-musl.tgz"
          curl -sSfL "$url" -o /tmp/cargo-binstall.tgz
          echo "${BINSTALL_SHA256}  /tmp/cargo-binstall.tgz" | sha256sum -c -
          tar xzf /tmp/cargo-binstall.tgz -C ~/.cargo/bin/
          cargo binstall -y dioxus-cli@0.7.10
      - run: cargo build
      - name: Build web UI
        # `--package` is load-bearing: the workspace has `default-members`,
        # and dx 0.7.10 canonicalizes those relative paths against its own
        # working directory, which panics from inside `crates/farhelm-ui`.
        run: cd crates/farhelm-ui && dx build --package farhelm-ui --platform web --release
      - name: Install Playwright
        run: cd e2e && npm ci && npx playwright install --with-deps chromium webkit
      - name: Run e2e tests
        run: cd e2e && npx playwright test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
