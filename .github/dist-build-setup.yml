# Steps cargo-dist splices into the top of EVERY per-target build job
# (`build-local-artifacts` in the generated `release.yml`), before it installs
# dist or runs a single cargo command.
#
# This file is NOT a workflow. It is a bare YAML list of GitHub Actions steps
# that only dist reads, at `dist generate` time, inlining them into the
# generated workflow — so a change here does nothing until `dist init --yes`
# regenerates `release.yml`, the same rule as every other dist setting.
#
# It sits in `.github/` rather than `.github/workflows/` because GitHub tries
# to parse everything at the top level of the workflows directory as a
# workflow, and a top-level YAML list is not one.
# `github-build-setup` in `dist-workspace.toml` resolves its value relative to
# `.github/workflows/`, which is why the configured path starts with `../`.
#
# ## Why the release test gate lives here rather than in a plan job
#
# These steps are the ONLY place a pre-build gate can fail loudly. dist 0.32's
# generated graph treats a skipped artifact job as acceptable — `host` runs
# when `build-local-artifacts` is `success` OR `skipped` — so a failed
# dependency UPSTREAM of the build jobs (a `plan-jobs` entry, which is what
# this project used first) makes them skip, and the release is then created
# with none of its payloads. A failure INSIDE a build job is a job failure,
# which `host` does reject. So the gate runs here, in the job whose result
# actually gates publication.
#
# The steps are ordered cheapest-refusal-first: the tag shape, then the tests,
# then the things only a release build needs.
#
# What a red gate does and does not undo. The boundary it enforces is
# PUBLICATION: no GitHub Release is created and nothing downstream of `host`
# runs. It is not a stop-everything switch — the build matrix is
# `fail-fast: false` and only the x86_64 Linux leg runs the suite, so the arm64
# Linux and macOS legs can finish and leave their outputs as temporary Actions
# artifacts. Those expire with the run and never reach a release. The TAG that
# triggered the run is also already pushed and stays pushed, so a failed
# rehearsal needs an explicit `git push --delete origin <tag>` before the same
# version can be tried again.
#
# ## What the rest of it is for
#
# Every build job has to mark what it builds as a RELEASE build (D13).
# `farhelm-helm`'s build script turns `FARHELM_RELEASE_BUILD` into the
# `farhelm_release_build` cfg, and both shipped binaries embed the helm. A
# build job that skipped the last step here would produce a `farhelm` that
# runs normally and refuses to download provisioning payloads, which nothing
# else in the build would notice; the desktop build refuses to start without
# it (`scripts/build-desktop-binary.sh`).
#
# ## Release build isolation
#
# The release gate keeps its build inputs separate from ordinary CI:
#
# - NO caching, anywhere in the release path. `ci.yml` caches `target/` and
#   Cargo dependencies because it runs on every push; this runs a few times
#   a year, and a cache is a mutable input to the one build whose output gets
#   signed. Cold builds cost minutes and remove the question. (It also
#   sidesteps the disk-exhaustion failure that made `ci.yml`'s desktop job
#   drop its `restore-keys`.)
# - NO `setup-rust-toolchain`. The runner supplies rustup; its proxies read
#   the checked-out rust-toolchain.toml and install the pinned toolchain on
#   first use. dist adds release target triples to that same toolchain.
#   No second toolchain manager or copy of the version is needed here.

- name: Assert the tag names this workspace's exact version
  # cargo-dist accepts several tag spellings for the same version — `0.0.3`,
  # `v0.0.3`, `farhelm-v0.0.3` — but Farhelm's download path accepts exactly
  # one. `release_payloads.rs` requires the signed trusted comment to read
  # `farhelm v{CARGO_PKG_VERSION}` and builds its default release URL with the
  # same leading `v`, so a bare `0.0.3` tag would sail through dist and
    # produce a release that, once the maintainer signed it, no shipped helm
  # could install.
  #
  # Refusing here means the mistake costs a deleted tag instead of a
  # published, unusable release. `sign-sums.yml` asserts the same thing again
  # after publishing, since these are separate jobs.
  run: |
    set -euo pipefail
    # `[workspace.package].version` is the only bare `version = "…"` at the
    # start of a line in the root manifest; workspace dependencies spell
    # theirs inline. Requiring exactly one match keeps that assumption from
    # rotting silently.
    matches=$(grep -c '^version = "' Cargo.toml)
    test "$matches" = 1 || {
      echo "expected exactly one top-level version in Cargo.toml, found $matches" >&2
      exit 1
    }
    version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
    if [ "$GITHUB_REF_NAME" != "v$version" ]; then
      echo "tag $GITHUB_REF_NAME does not name this workspace's version" >&2
      echo "  expected exactly: v$version" >&2
      echo "  this tag is spent; fix on main and cut the next version per releasing/AGENTS.md" >&2
      exit 1
    fi
    echo "ok: $GITHUB_REF_NAME matches [workspace.package].version"

- name: Assert the changelog dist is about to publish
  # dist copies the `CHANGELOG.md` section for the tagged version into the
  # GitHub release body and names the release after its heading, silently
  # publishing bare download tables when it finds no section and whatever
  # section it did match when a heading is malformed. Both are wrong releases
  # that nothing downstream would notice. The plan job already computed the
  # announcement (`announcement_title` and `announcement_changelog` in its
  # manifest, exposed as the `val` output every build job receives), so this
  # compares that against the checker's own reading of the file: a stable tag
  # must land on the newest section exactly, a prerelease on nothing or on its
  # own version's stable section. `releasing/AGENTS.md` has the format.
  #
  # The manifest travels in an environment variable rather than being
  # interpolated into the script, so its JSON is never shell text. dist is not
  # installed yet at this point in the build job (its install step comes after
  # these spliced steps), which is why the plan job's manifest is reused
  # instead of running `dist plan` again.
  env:
    PLAN_MANIFEST: ${{ needs.plan.outputs.val }}
  run: |
    set -euo pipefail
    python3 releasing/check-changelog.py format
    python3 releasing/check-changelog.py announce --tag "$GITHUB_REF_NAME" --manifest-env PLAN_MANIFEST

- name: Free unused image toolchains before native desktop gates
  # The release job later holds the workspace's debug test build (GPUI
  # included), the desktop app's own test build, and cargo-dist's musl output
  # at once. GitHub's stock Linux image starts nearly full of unrelated
  # toolchains, so clearing this narrow allowlist before those builds
  # preserves headroom without touching Rust, Cargo, caches, or any release
  # output.
  if: runner.os == 'Linux' && runner.arch == 'X64'
  run: |
    sudo rm -rf \
      /usr/local/lib/android \
      /usr/share/dotnet \
      /usr/local/.ghcup \
      /usr/share/swift \
      /opt/hostedtoolcache/CodeQL \
      /usr/lib/jvm \
      /usr/local/share/powershell \
      /usr/local/julia* \
      /usr/share/miniconda
    df -h /

# ---------------------------------------------------------------------------
# The release gate, on the x86_64 Linux build job only.
#
# One job runs it, and the choice is about COST, not capability. The suite is
# architecture-independent; running it on the arm64 job too would duplicate
# the same gate, including the real Podman recipe's network bootstrap. (If
# arm-specific coverage ever becomes worth paying for, widening the `if` below
# is the whole change.) macOS is the one that genuinely cannot: the suite wants
# a systemd user manager and the tests' ssh loopback, neither of which that
# runner has, which is why its leg runs only the suites that need neither:
# the uninstall, lock and desktop app tests and the GUI crates' tests (see
# "The macOS half of the gate" below).
#
# Ordinary CI retains only fast compile, lint, formatter, installer, generated
# workflow, and JavaScript-harness checks. The costly Rust and
# cross-distribution gates live here, where a failure rejects publication
# from the artifact job that ran it.
# ---------------------------------------------------------------------------

- name: Install tmux for the tests that start a real tmux server
  # Farhelm itself runs no tmux, but a few tests still start a real server:
  # the ones that build an earlier release's tmux layout by hand and check
  # that a starting supervisor ends it, the test-state cleanup that ends a
  # server a killed test left behind, and the test of a user's own tmux
  # (stock `/usr/bin/tmux`) under a session's scope. Without a tmux they skip
  # with a SKIPPED message, and a skip is not a pass, so the gate provides the
  # distribution's tmux rather than letting that coverage disappear.
  if: runner.os == 'Linux' && runner.arch == 'X64'
  run: sudo apt-get update && sudo apt-get install -y tmux

- name: Provision passwordless ssh to localhost
  # The ssh transport is under test, not just a deployment detail: the
  # connection manager's ssh-row test dials a real supervisor through the
  # user's own ssh, and skips loudly where passwordless self-ssh is missing.
  # Provisioning it here keeps that skip a local-only affordance instead of
  # permanently uncovered ssh coverage in the one run that gates a release.
  if: runner.os == 'Linux' && runner.arch == 'X64'
  run: |
    sudo apt-get install -y openssh-server
    sudo systemctl enable --now ssh || sudo service ssh start
    mkdir -p ~/.ssh && chmod 700 ~/.ssh
    ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
    # `from=` restricts this passphrase-less key to loopback, which is the
    # only place anything uses it.
    printf 'from="127.0.0.1,::1" ' >> ~/.ssh/authorized_keys
    cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
    chmod 600 ~/.ssh/authorized_keys
    # BatchMode makes an unknown host key a hard failure rather than a
    # prompt, so known_hosts has to be seeded before anything dials.
    ssh-keyscan -H localhost >> ~/.ssh/known_hosts
    # Fail here, loudly, rather than letting the test fall back to its skip
    # and report green on coverage that never ran.
    ssh -o BatchMode=yes localhost true

- name: Select Python with non-reaping child observation on macOS
  # The recorder needs waitid/WNOWAIT, exposed on macOS starting in Python3.13.
  if: runner.os == 'macOS'
  uses: actions/setup-python@v7
  with:
    python-version: '3.13'

- name: Install the pinned test runner
  # Only these jobs execute Rust tests. The tool's immutable byte pins are
  # verified in a fresh job directory; no shared release cache is introduced.
  if: runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'X64')
  run: |
    nextest_dir=$(python3 scripts/install-pinned-nextest.py --output-root "$RUNNER_TEMP/nextest-tools") || exit 1
    printf '%s\n' "$nextest_dir" >> "$GITHUB_PATH"

- name: Prepare rootless Podman integration fixtures
  # The integration suite never pulls images itself: a missing offline base is
  # a failed premise. Prepare it before the restored release-wide selection.
  if: runner.os == 'Linux' && runner.arch == 'X64'
  run: |
    # The focused nextest setup builds the native musl farhelm payload before
    # cargo-dist has produced any release artifact.
    sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs musl-tools dbus-user-session
    # Hosted jobs have no login session. Podman's production probe needs the
    # runner's user manager, its environment and a usable transient scope;
    # installing the engine alone leaves that prerequisite unavailable.
    runner_uid=$(id -u)
    sudo loginctl enable-linger "$runner_uid"
    sudo systemctl start "user@$runner_uid.service"
    export XDG_RUNTIME_DIR="/run/user/$runner_uid"
    export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
    test -S "$XDG_RUNTIME_DIR/bus"
    systemctl --user show-environment >/dev/null
    systemd-run --user --scope --collect --quiet --unit="farhelm-ci-probe-$(uuidgen).scope" -- true
    # Later steps start fresh shells; the test helm must inherit the same bus.
    printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=%s\n' \
      "$XDG_RUNTIME_DIR" "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
    test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
    base=docker.io/library/ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    podman pull "$base"
    podman run --rm "$base" true

- name: Install the GPUI app's build packages
  # The workspace selection below builds the GPUI GUI crates (`farhelm-gui`
  # is a workspace member), and GPUI's -sys crates find fontconfig and
  # xkbcommon through pkg-config in their build scripts. `libglib2.0-dev` is
  # here for the desktop app's step further down, which compiles GIO (the app
  # opens saved downloads through it), whose -sys crates resolve GLib the same
  # way. The in-process tests use GPUI's test platform with bundled fonts.
  # The smoke opens a real Wayland window and has its own runtime packages.
  if: runner.os == 'Linux' && runner.arch == 'X64'
  run: sudo apt-get install -y pkg-config libfontconfig-dev libxkbcommon-dev libglib2.0-dev

- name: Run the test suite
  # Nextest starts a process per test with four slots shared across binaries.
  # Immediate success output retains runtime SKIPPED explanations: a test
  # returning early is still a pass in JUnit, not measured substrate coverage.
  # Doctests use Rust's separate runner because nextest does not execute them.
  #
  # Include the CLI's real-supervisor and terminal integration targets. The
  # diagnosed shallow-pause observation is corrected and the remaining old
  # reports were dismissed; neither still justifies excluding the whole suite.
  #
  # `--workspace` reaches past `default-members`, so farhelm-desktop is
  # excluded by name, as in the development inventory's workspace run
  # (`.agents/validation.md`): its tests are a selection of their own there,
  # and here in "Test the desktop app" below.
  #
  # ONE BUILD FOR THE WORKSPACE RUST TESTS. The doctests use the same
  # `--workspace --exclude farhelm-desktop` selection. Cargo unifies features
  # across the selected packages, so a narrower `-p` or `--exclude` can turn
  # off features in shared crates (syn, serde, tracing and their like) and
  # everything above them is compiled again: the old split into per-package
  # commands spent about six minutes of every tag build recompiling crates
  # this step had just built. Keep the selection identical when adding a
  # workspace test step and narrow with `-E`. "Test the desktop app" covers
  # the crate this selection leaves out: its `-p farhelm-desktop`
  # recompiles 57 crates on top of this build (measured 2026-11-16).
  # The Podman module's scoped setup additionally builds a native musl CLI
  # payload for the ordinary installer inside its Ubuntu container. That
  # target cannot reuse the host test executable's dynamic glibc linkage.
  if: runner.os == 'Linux' && runner.arch == 'X64'
  run: |
    python3 scripts/record-test-run.py \
      --runner nextest --kind release --selection 'workspace Rust targets except farhelm-desktop' \
      --concurrency '4 nextest slots across binaries; retries 0' \
      --output-root "$RUNNER_TEMP/test-run-evidence" \
      -- cargo nextest run --workspace --exclude farhelm-desktop
    python3 scripts/record-test-run.py \
      --kind release --selection 'workspace doctests except farhelm-desktop' \
      --concurrency '4 doctest threads' --output-root "$RUNNER_TEMP/test-run-evidence" \
      -- cargo test --locked --doc --workspace --exclude farhelm-desktop -- --show-output --test-threads=4

- name: Test the desktop app
  # The desktop app's process (`crates/farhelm-desktop`): its bootstrap,
  # updater and state files, the only run of these tests in this job. The GUI
  # crates' own tests already ran in the workspace selection above. The macOS
  # job runs this selection together with the GUI crates in "Compile and test
  # the window half of the Mac release".
  if: runner.os == 'Linux' && runner.arch == 'X64'
  run: |
    python3 scripts/record-test-run.py \
      --runner nextest --kind release --selection 'Linux desktop unit tests' --concurrency '4 nextest slots; retries 0' \
      --output-root "$RUNNER_TEMP/test-run-evidence" \
      -- cargo nextest run --locked -p farhelm-desktop
    python3 scripts/record-test-run.py \
      --kind release --selection 'Linux desktop doctests' --concurrency '4 doctest threads' \
      --output-root "$RUNNER_TEMP/test-run-evidence" \
      -- cargo test --locked --doc -p farhelm-desktop -- --show-output --test-threads=4

- name: Install the GPUI smoke's runtime packages
  # Mutter provides the headless Wayland display. The harness starts it with
  # dbus-run-session (from dbus-daemon) to give the app and supervisor a bus
  # separate from the runner's Podman setup. The harness checks for both of
  # Mesa's driver manifests before launching the app. The build packages
  # above already supply fontconfig and its system font dependencies. The
  # smoke builds the debug desktop app with its automation bridge, which links
  # GPUI's X11 backend too, so it also needs the xcb and xkbcommon-x11
  # development libraries (the gate's first rehearsal failed to link without
  # them).
  if: runner.os == 'Linux' && runner.arch == 'X64'
  run: sudo apt-get install -y mutter dbus-daemon mesa-vulkan-drivers libegl-mesa0 libxcb1-dev libxkbcommon-x11-dev

- name: Run the GPUI app end-to-end smoke
  # The smoke needs an agent-enabled desktop executable and a gpui-agent CLI
  # in addition to the binaries built by the workspace tests. Let the harness
  # build in the same Cargo target directory so it can reuse matching outputs.
  # The smoke's second app launch reuses the binaries from its first launch.
  if: runner.os == 'Linux' && runner.arch == 'X64'
  run: |
    python3 scripts/record-test-run.py \
      --kind release --selection 'GPUI app end-to-end smoke' \
      --concurrency 'one app run, steps in order; one step starts and stops a second run' \
      --termination-grace 30 --output-root "$RUNNER_TEMP/test-run-evidence" \
      -- python3 -B scripts/gui-e2e-smoke.py

- name: Run the OMP reporter asset scenarios
  # The injected OMP asset's own execution proof — dispatch ordering, stale-id
  # cancellation, execution-time file recheck, the silent-failure boundary —
  # runs through the recorder like every other gate, with its own selection
  # name. Node comes with the runner image.
  if: runner.os == 'Linux' && runner.arch == 'X64'
  run: |
    cd crates/farhelm-supervisor/asset-js-tests
    python3 "$GITHUB_WORKSPACE/scripts/record-test-run.py" \
      --kind release --selection 'OMP reporter asset scenarios' --concurrency 'node default discovery' \
      --output-root "$RUNNER_TEMP/test-run-evidence" -- node --test

- name: Provision a CentOS Stream 9 host over ssh
  # The cross-distribution provisioning leg. It belongs in the release gate
  # more than anywhere else: what it proves is that the musl-static payloads
  # THIS BUILD is about to publish actually install and run on a host that is
  # not the runner's own Ubuntu. Keeping it inside the artifact job makes a
  # failure refuse publication; ordinary CI does not run this container gate.
  #
  # musl-tools is installed again rather than reordered: the release-build
  # prerequisites further down run after every gate step, and a gate must not
  # depend on a step that has not run yet.
  if: runner.os == 'Linux' && runner.arch == 'X64'
  run: |
    sudo apt-get update && sudo apt-get install -y musl-tools
    python3 scripts/record-test-run.py \
      --kind release --selection 'CentOS provisioning fixture' --concurrency 'one selected test' \
      --output-root "$RUNNER_TEMP/test-run-evidence" -- scripts/test-provision-centos.sh \
      --kind release --output-root "$RUNNER_TEMP/test-run-evidence"

# ---------------------------------------------------------------------------
# The macOS half of the gate.
#
# Every release validates Apple compilation, desktop unit behavior and native
# installer/uninstaller filesystem behavior here. The focused uninstall job in
# ci.yml is also available on demand. Keeping this gate inside the artifact
# job makes any failure block publication.
#
# The full session suite needs a systemd user manager and SSH loopback, which
# this runner does not provide; these native checks do not require that
# substrate.
# ---------------------------------------------------------------------------

- name: Validate standalone uninstall on macOS
  # Exercise the installed CLI headlessly; file removal needs no window.
  #
  # The three nextest commands select the same packages and targets and pick
  # their tests with a filter, so the first builds everything and the others
  # reuse it. Separate `-p` selections resolved different features (the
  # supervisor's `test-seams`, which farhelm's tests turn on) and recompiled
  # the supervisor and everything above it; the same accident on the Linux
  # leg is described under "Run the test suite".
  #
  # `--locked` because a release must build from the committed lockfile and
  # nothing else. It used to sit on a separate `cargo build -p farhelm` step,
  # removed because nothing ran its output: the integration-test build below
  # replaces `target/debug/farhelm`, which is the binary the uninstall
  # acceptance test exercises, and the release build compiles the CLI's
  # shipped configuration again at the end of this job.
  if: runner.os == 'macOS'
  run: |
    shared=(-p farhelm -p farhelm-supervisor --bin farhelm --lib --test session_hold --test version_lock_forwarder)
    python3 scripts/record-test-run.py \
      --runner nextest --kind release --selection 'macOS uninstall unit tests' --concurrency '4 nextest slots; retries 0' \
      --output-root "$RUNNER_TEMP/test-run-evidence" \
      -- cargo nextest run --locked "${shared[@]}" -E 'package(farhelm) & kind(bin) & test(uninstall::)'
    # Version locks, the installation lock and the session keeper rest on
    # macOS behavior Linux only approximates (flock on an APFS folder,
    # extended attributes, RENAME_EXCL, F_FULLFSYNC, kqueue NOTE_EXIT).
    python3 scripts/record-test-run.py \
      --runner nextest --kind release --selection 'macOS version and installation lock tests' --concurrency '4 nextest slots; retries 0' \
      --output-root "$RUNNER_TEMP/test-run-evidence" \
      -- cargo nextest run --locked "${shared[@]}" \
      -E 'package(farhelm-supervisor) & kind(lib) & test(/installation::|version_lock::|session_hold::/)'
    python3 scripts/record-test-run.py \
      --runner nextest --kind release --selection 'macOS version-lock process tests' --concurrency '4 nextest slots; retries 0' \
      --output-root "$RUNNER_TEMP/test-run-evidence" \
      -- cargo nextest run --locked "${shared[@]}" \
      -E 'package(farhelm) & (binary(session_hold) | binary(version_lock_forwarder))'
    python3 scripts/record-test-run.py \
      --kind release --selection 'macOS installed uninstall acceptance' --concurrency 'one fixture at a time' \
      --output-root "$RUNNER_TEMP/test-run-evidence" \
      -- python3 scripts/test-uninstall.py --binary target/debug/farhelm --installer scripts/install.sh

- name: Compile and test the window half of the Mac release
  # The desktop app and the GPUI GUI crates, built against GPUI's macOS
  # platform (AppKit, Metal, CoreText) instead of the Linux one the x86_64 job
  # tests. Only here are the Mac-only parts compiled (the desktop app's
  # NSSound player and keyboard-navigation preference read, the GUI's title
  # band) and the Mac-only tests run: the title band's rows, the Mac shortcut
  # names, and the host-text tests that shape with CoreText, which caught a
  # Mac-only line-break bug Linux cannot see. The tests run on GPUI's test
  # platform rather than opening real windows.
  if: runner.os == 'macOS'
  run: |
    gui=(-p farhelm-desktop -p farhelm-gui -p farhelm-grid-model -p farhelm-input-mapping)
    python3 scripts/record-test-run.py \
      --runner nextest --kind release --selection 'macOS desktop unit tests' --concurrency '4 nextest slots; retries 0' \
      --output-root "$RUNNER_TEMP/test-run-evidence" \
      -- cargo nextest run --locked "${gui[@]}"
    python3 scripts/record-test-run.py \
      --kind release --selection 'macOS desktop doctests' --concurrency '4 doctest threads' \
      --output-root "$RUNNER_TEMP/test-run-evidence" \
      -- cargo test --locked --doc "${gui[@]}" -- --show-output --test-threads=4

# ---------------------------------------------------------------------------
# Release-build prerequisites, on every build job.
# ---------------------------------------------------------------------------

- name: Install musl build tools
  # The Linux targets are static musl (D4), and rusqlite's `bundled` feature
  # compiles SQLite from C source — so the build needs a musl-targeting C
  # toolchain, not just the Rust std for the triple. macOS builds natively and
  # needs none of this.
  if: runner.os == 'Linux'
  run: sudo apt-get update && sudo apt-get install -y musl-tools

- name: Collect test run failure evidence
  # Each wrapper invocation owns a UUID directory and bounded logs. Keep
  # only that schema's files, never arbitrary test state or build output.
  # Collection follows the runtime gates and sees only failures so far.
  # Later packaging failures cannot trigger this already-completed step.
  if: failure() && (runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'X64'))
  run: |
    evidence_dir="$RUNNER_TEMP/test-run-failure-evidence"
    mkdir -p "$evidence_dir"
    for run_dir in "$RUNNER_TEMP"/test-run-evidence/*; do
      [ -d "$run_dir" ] && [ ! -L "$run_dir" ] || continue
      run_id="${run_dir##*/}"
      [[ "$run_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || continue
      mkdir -p "$evidence_dir/$run_id"
      for evidence in "$run_dir/manifest.json" "$run_dir/output-head.log" "$run_dir"/output-tail-*.log; do
        if [ -f "$evidence" ] && [ ! -L "$evidence" ]; then
          cp -- "$evidence" "$evidence_dir/$run_id/"
        fi
      done
      # Keep fixed runner inputs and raw JUnit bytes through a bounded
      # collector; missing, oversized or unreadable files remain explicit.
      if [ -e "$run_dir/nextest.toml" ] || [ -e "$run_dir/nextest" ]; then
        python3 scripts/test_run_nextest.py "$run_dir" "$evidence_dir/$run_id" \
          > "$evidence_dir/$run_id/nextest-collection.json"
      fi
      # Export through the fixed-layout collector even if the recorder died
      # before building its own archive. Never recursively upload raw state.
      if [ -d "$run_dir/test-traces" ] && [ ! -L "$run_dir/test-traces" ]; then
        python3 scripts/test_run_traces.py "$run_dir/test-traces" \
          "$evidence_dir/$run_id/recovered-traces.tar" > "$evidence_dir/$run_id/trace-collection.json"
      fi
    done

- name: Upload test run failure evidence
  # The name stays outside cargo-dist's artifacts-* download namespace;
  # diagnostics must never become signed release payloads.
  if: failure() && (runner.os == 'macOS' || (runner.os == 'Linux' && runner.arch == 'X64'))
  uses: actions/upload-artifact@v4
  with:
    name: test-run-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    if-no-files-found: warn
    path: "${{ runner.temp }}/test-run-failure-evidence"

- name: Mark the build as a release build
  # Every build job, because both shipped binaries embed the helm: cargo-dist's
  # `farhelm` build on all three targets and, on macOS, the desktop package's
  # `scripts/build-desktop-binary.sh`, which refuses to run without it. Its
  # presence is what `farhelm-helm`'s build script turns into the release
  # cfg (D13), which makes the helm download provisioning payloads by
  # default; a release built without it would refuse to set up or update
  # hosts.
  #
  # Written into the job environment for cargo-dist's build, which comes after
  # these steps, and for nothing before it: every test step above builds and
  # tests the helm as an ordinary development build, and the marker appearing
  # mid-job would also rerun `farhelm-helm`'s build script and recompile the
  # helm and everything above it.
  run: echo "FARHELM_RELEASE_BUILD=1" >> "$GITHUB_ENV"
