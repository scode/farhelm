# Modified for Farhelm: changed or added by the patch layers in vendor/patches/gpui/ (vendor/README.md, "GPUI").
[workspace]
resolver = "3"
members = ["gpui-agent", "testapp"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/wsp-labs/gpui-agent"
rust-version = "1.98"

[workspace.dependencies]
gpui-agent = { path = "gpui-agent" }
gpui-agent-protocol = { path = "../crates/protocol" }
# The gpui-pre recipe omits optional Zed checkout paths so Cargo can resolve this workspace independently.
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
gpui-pre-linux = { version = "=0.3.12", features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.12", features = ["test-support", "font-kit", "wayland", "x11", "runtime_shaders"] }
anyhow = "1.0.86"
async-channel = "2.5"
image = { version = "0.25.1", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.144"

# Keep the upstream test app on the same patched crates when run through its own workspace.
# Consumers must repeat these overrides at their workspace root; Cargo does not inherit them.
[patch.crates-io]
gpui-pre = { path = "../../gpui-pre" }
gpui-pre-linux = { path = "../../gpui-pre-linux" }
gpui-pre-wgpu = { path = "../../gpui-pre-wgpu" }
gpui-pre-macos = { path = "../../gpui-pre-macos" }
