# Modified for Farhelm: changed or added by the patch layers in vendor/patches/gpui/ (vendor/README.md, "GPUI").
[package]
name = "gpui-agent-testapp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A GPUI app that exercises every gpui-agent command"
publish = false

[features]
default = []
zed = []
gpui-pre-0-3-9 = ["dep:gpui-pre", "dep:gpui-pre-platform", "gpui-agent/gpui-pre-0-3-9"]
gpui-pre-0-3-12 = ["dep:gpui-pre", "dep:gpui-pre-platform", "gpui-agent/gpui-pre-0-3-12"]

[dependencies]
gpui-pre = { workspace = true, optional = true }
gpui-pre-platform = { workspace = true, optional = true }
gpui-agent.workspace = true
serde_json.workspace = true
unicode-segmentation = "1.10"
