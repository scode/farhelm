# Process-per-test execution makes in-process slot semaphores local to one
# test. Keep the shared resource budget here, where it covers every binary.
nextest-version = { required = "0.9.143" }

[profile.default]
test-threads = 4
retries = 0
flaky-result = "fail"
success-output = "immediate"
failure-output = "immediate-final"
final-status-level = "skip"
fail-fast = false

# A stuck test gets time to run its own teardown before the runner kills its
# process group. An outer recorder must allow more than this five-second grace.
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "5s" }
leak-timeout = { period = "1s", result = "fail" }

[profile.default.junit]
# The recorded-run adapter supplies a fresh store directory for each run.
# Selected-out tests stay visible so a narrow pass cannot look like a suite pass.
path = "junit.xml"
# Output already goes to the recorder's bounded log and per-test traces.
# Keep the report for outcomes rather than duplicating arbitrary test output.
store-success-output = false
store-failure-output = false
report-skipped = "all"

[test-groups]
e2e = { max-threads = 4 }
supervisor-tmux = { max-threads = 2 }

[[profile.default.overrides]]
# ScratchServer's process-local semaphore cannot coordinate nextest children.
# Cover its modules rather than enumerating today's consumers, so new fixture
# users inherit the two-server allowance. Pure tests in these modules share it.
filter = "package(farhelm-supervisor) & (test(tmux::tests::) | test(tmux::stream::tests::) | test(tmux::sink::tests::))"
test-group = "supervisor-tmux"

[[profile.default.overrides]]
filter = "package(farhelm) & binary(e2e)"
test-group = "e2e"

[[profile.default.overrides]]
# This fixture starts two supervisors and previously reserved two in-process
# harness permits. Charge both to the runner's shared process budget as well.
filter = "test(=merged_hosts::two_real_hosts_serve_one_merged_list_and_both_are_operable)"
threads-required = 2

[[profile.default.overrides]]
# This test measures memory growth while deliberately blocking a viewer.
# Reserve the default global budget rather than measuring alongside other tests.
filter = "test(terminal_backpressure::memory_stays_flat_while_a_viewer_is_stalled)"
threads-required = 4
