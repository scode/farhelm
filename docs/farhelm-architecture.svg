<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 890" role="img"
     aria-label="Farhelm architecture: web browser and native Mac app are two faces of one helm; the helm connects to a local supervisor directly and to remote supervisors over SSH; each supervisor persists session state in SQLite and drives a private tmux server holding the agents' real terminals; dashed outlines mark processes that can restart without losing anything, and restart resumes each session's captured conversation."
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24292f"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="890" fill="#fdfdfc"/>

  <!-- Title -->
  <text x="40" y="38" font-size="21" font-weight="700" fill="#24292f">Farhelm — supervising coding agents across hosts</text>
  <text x="40" y="60" font-size="12.5" fill="#57606a">one helm, many hosts, real terminals — every dashed box can die and come back without losing anything</text>

  <!-- Clients: two faces of the one helm -->
  <rect x="180" y="84" width="230" height="70" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="295" y="112" font-size="14" font-weight="600" fill="#24292f" text-anchor="middle">Web browser</text>
  <text x="295" y="131" font-size="10.5" fill="#57606a" text-anchor="middle">any machine — nothing installed</text>

  <rect x="750" y="84" width="230" height="70" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="865" y="112" font-size="14" font-weight="600" fill="#24292f" text-anchor="middle">Native Mac app</text>
  <text x="865" y="131" font-size="10.5" fill="#57606a" text-anchor="middle">helm + local supervisor in one bundle</text>

  <!-- Client-to-helm edges -->
  <line x1="295" y1="154" x2="486" y2="222" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="345" y="182" font-size="11" font-weight="600" fill="#24292f" text-anchor="end">HTTP + token</text>
  <text x="345" y="196" font-size="10.5" fill="#57606a" text-anchor="end">loopback · SSH forward from afar</text>

  <line x1="865" y1="154" x2="674" y2="222" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="790" y="182" font-size="10.5" fill="#57606a" text-anchor="start">embeds the helm — same web UI inside</text>

  <!-- Helm -->
  <rect x="430" y="224" width="300" height="98" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="580" y="252" font-size="14.5" font-weight="700" fill="#24292f" text-anchor="middle">Helm — the one control plane</text>
  <text x="580" y="274" font-size="11" fill="#57606a" text-anchor="middle">host registry · aggregates every host's sessions</text>
  <text x="580" y="291" font-size="11" fill="#57606a" text-anchor="middle">serves the UI · supervisors hold the truth</text>

  <!-- helm.db cylinder -->
  <line x1="730" y1="272" x2="854" y2="272" stroke="#24292f" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="793" y="264" font-size="10" fill="#57606a" text-anchor="middle">persists</text>
  <path d="M860,248 v44 a70,9 0 0 0 140,0 v-44" fill="#fff1d6" stroke="#b45309" stroke-width="1.4"/>
  <ellipse cx="930" cy="248" rx="70" ry="9" fill="#ffe3b3" stroke="#b45309" stroke-width="1.4"/>
  <text x="930" y="280" font-size="12" font-weight="700" fill="#8a4b06" text-anchor="middle">helm.db</text>
  <text x="930" y="322" font-size="10.5" fill="#57606a" text-anchor="middle">host registry · web token</text>
  <text x="930" y="336" font-size="10.5" fill="#57606a" text-anchor="middle">last-known session cache</text>

  <!-- Helm-to-supervisor edges -->
  <line x1="490" y1="322" x2="184" y2="450" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="320" y="376" font-size="10.5" fill="#57606a" text-anchor="end">local — no SSH</text>

  <line x1="670" y1="322" x2="736" y2="450" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="716" y="376" font-size="10.5" fill="#57606a" text-anchor="start">SSH — supervisor listens on no port</text>

  <!-- Local host -->
  <rect x="40" y="414" width="520" height="316" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="56" y="437" font-size="12.5" font-weight="600" fill="#57606a">helm's machine (local host)</text>

  <!-- Remote host, with a ghost behind it suggesting more hosts -->
  <rect x="616" y="430" width="520" height="316" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="600" y="414" width="520" height="316" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="616" y="437" font-size="12.5" font-weight="600" fill="#57606a">remote Linux host</text>
  <text x="1104" y="437" font-size="10.5" font-style="italic" fill="#8b949e" text-anchor="end">· any number of these</text>

  <!-- Supervisors (dashed: restartable) -->
  <rect x="70" y="452" width="220" height="62" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="180" y="478" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">Supervisor</text>
  <text x="180" y="496" font-size="10.5" fill="#57606a" text-anchor="middle">authority on its sessions</text>

  <rect x="630" y="452" width="220" height="62" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="740" y="478" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">Supervisor</text>
  <text x="740" y="496" font-size="10.5" fill="#57606a" text-anchor="middle">authority on its sessions</text>

  <!-- supervisor.db cylinders -->
  <line x1="290" y1="480" x2="348" y2="480" stroke="#24292f" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="319" y="472" font-size="10" fill="#57606a" text-anchor="middle">writes</text>
  <path d="M350,458 v40 a75,9 0 0 0 150,0 v-40" fill="#fff1d6" stroke="#b45309" stroke-width="1.4"/>
  <ellipse cx="425" cy="458" rx="75" ry="9" fill="#ffe3b3" stroke="#b45309" stroke-width="1.4"/>
  <text x="425" y="487" font-size="12" font-weight="700" fill="#8a4b06" text-anchor="middle">supervisor.db</text>
  <text x="425" y="526" font-size="10.5" fill="#57606a" text-anchor="middle">sessions · profiles · boot id</text>
  <text x="425" y="540" font-size="10.5" fill="#57606a" text-anchor="middle">conversation ids</text>

  <line x1="850" y1="480" x2="908" y2="480" stroke="#24292f" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="879" y="472" font-size="10" fill="#57606a" text-anchor="middle">writes</text>
  <path d="M910,458 v40 a75,9 0 0 0 150,0 v-40" fill="#fff1d6" stroke="#b45309" stroke-width="1.4"/>
  <ellipse cx="985" cy="458" rx="75" ry="9" fill="#ffe3b3" stroke="#b45309" stroke-width="1.4"/>
  <text x="985" y="487" font-size="12" font-weight="700" fill="#8a4b06" text-anchor="middle">supervisor.db</text>
  <text x="985" y="526" font-size="10.5" fill="#57606a" text-anchor="middle">sessions · profiles · boot id</text>
  <text x="985" y="540" font-size="10.5" fill="#57606a" text-anchor="middle">conversation ids</text>

  <!-- Supervisor-to-tmux edges -->
  <line x1="180" y1="514" x2="180" y2="562" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="190" y="543" font-size="10.5" fill="#57606a" text-anchor="start">drives via tmux -C (control mode)</text>

  <line x1="740" y1="514" x2="740" y2="562" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="750" y="543" font-size="10.5" fill="#57606a" text-anchor="start">drives via tmux -C (control mode)</text>

  <!-- tmux servers (solid: outlive the supervisor) -->
  <rect x="70" y="566" width="460" height="148" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.6"/>
  <text x="82" y="588" font-size="13" font-weight="700" fill="#24292f">private tmux server</text>
  <text x="82" y="603" font-size="10" fill="#57606a">own socket · holds PTYs &amp; scrollback</text>

  <rect x="90" y="614" width="200" height="88" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.1"/>
  <text x="100" y="631" font-size="10.5" font-weight="600" fill="#57606a">session — ~/proj/app</text>
  <rect x="100" y="640" width="180" height="26" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.1"/>
  <text x="190" y="657" font-size="11" font-weight="600" fill="#0a4d8c" text-anchor="middle">Claude Code — real TUI</text>
  <rect x="100" y="672" width="180" height="22" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
  <text x="190" y="687" font-size="10.5" fill="#57606a" text-anchor="middle">shell tab</text>
  <text x="330" y="662" font-size="10.5" font-style="italic" fill="#8b949e">…more sessions</text>

  <rect x="630" y="566" width="460" height="148" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.6"/>
  <text x="642" y="588" font-size="13" font-weight="700" fill="#24292f">private tmux server</text>
  <text x="642" y="603" font-size="10" fill="#57606a">own socket · holds PTYs &amp; scrollback</text>

  <rect x="650" y="614" width="200" height="88" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.1"/>
  <text x="660" y="631" font-size="10.5" font-weight="600" fill="#57606a">session — ~/ws/api</text>
  <rect x="660" y="640" width="180" height="26" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.1"/>
  <text x="750" y="657" font-size="11" font-weight="600" fill="#0a4d8c" text-anchor="middle">Claude Code — real TUI</text>
  <rect x="660" y="672" width="180" height="22" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
  <text x="750" y="687" font-size="10.5" fill="#57606a" text-anchor="middle">shell tab</text>

  <rect x="870" y="614" width="200" height="88" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.1"/>
  <text x="880" y="631" font-size="10.5" font-weight="600" fill="#57606a">session — ~/ws/frontend</text>
  <rect x="880" y="640" width="180" height="26" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.1"/>
  <text x="970" y="657" font-size="11" font-weight="600" fill="#0a4d8c" text-anchor="middle">Codex — real TUI</text>
  <rect x="880" y="672" width="180" height="22" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
  <text x="970" y="687" font-size="10.5" fill="#57606a" text-anchor="middle">shell tab</text>

  <!-- Resume path: captured conversation id relaunches the exact conversation -->
  <path d="M1062,483 C1100,515 1100,575 1048,635" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="985" y="558" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">restart resumes the captured conversation</text>
  <text x="985" y="580" font-size="9.5" font-style="italic" fill="#b45309" text-anchor="middle">even after a host reboot</text>
  <text x="985" y="594" font-size="9.5" font-style="italic" fill="#b45309" text-anchor="middle">(fresh terminal, same conversation)</text>

  <!-- Durability story -->
  <text x="40" y="776" font-size="14" font-weight="700" fill="#24292f">Why a restart loses nothing</text>
  <text x="40" y="800" font-size="12" fill="#24292f">client or helm dies → sessions untouched; a returning helm reloads its host registry and last-known sessions from helm.db</text>
  <text x="40" y="822" font-size="12" fill="#24292f">supervisor restarts → tmux and the agents in it keep running; supervisor.db still knows every session, profile, and conversation</text>
  <text x="40" y="844" font-size="12" fill="#24292f">host reboots → terminals are gone, conversations are not: sessions show interrupted, and restart resumes each one via its captured id (claude --resume &lt;id&gt;)</text>
  <text x="40" y="870" font-size="11" fill="#8b949e">dashed outline = disposable, restarts freely · solid = keeps running while its host is up · amber cylinder = SQLite state, survives restarts and reboots · blue = the agent's real terminal</text>
</svg>
