<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img"
     aria-label="Farhelm architecture: the Farhelm app on your Mac or Linux desktop is one process holding the window and the helm; the window talks to the built-in helm over loopback only (UI channel, terminal streams, file transfers) and draws every terminal from its grid stream; the helm keeps hosts, last-known sessions, preferences and templates in helm.db; it reaches the local supervisor directly (on a Mac, started by the app and kept running after you quit) and supervisors on remote Linux hosts and Apple-silicon Macs over SSH; each supervisor persists session state in SQLite and runs every terminal (an agent's or a shell tab's) in a terminal host of its own, a small process that holds the terminal and outlives the supervisor; dashed outlines mark processes that can restart without losing anything, and restart resumes each session's captured conversation."
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24292f"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="850" fill="#fdfdfc"/>

  <!-- Title -->
  <text x="40" y="38" font-size="21" font-weight="700" fill="#24292f">Farhelm — supervising coding agents across hosts</text>
  <text x="40" y="60" font-size="12.5" fill="#57606a">one app, many hosts, real terminals — every dashed box can die and come back without losing anything</text>

  <!-- The Farhelm app: one process holding the window and the helm. Dashed
       because quitting, crashing or updating it never touches a session. The
       inner boxes are parts of that process, so they get the neutral card
       stroke rather than a lifetime style of their own. -->
  <rect x="40" y="84" width="800" height="168" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="106" font-size="12.5" font-weight="600" fill="#57606a">Farhelm app — on your Mac or Linux desktop</text>
  <text x="824" y="106" font-size="11" font-style="italic" fill="#8b949e" text-anchor="end">· one process</text>

  <rect x="64" y="120" width="240" height="112" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.1"/>
  <text x="184" y="150" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">Window</text>
  <text x="184" y="172" font-size="11" fill="#57606a" text-anchor="middle">native UI</text>
  <text x="184" y="190" font-size="11" fill="#57606a" text-anchor="middle">draws every terminal</text>
  <text x="184" y="208" font-size="11" fill="#57606a" text-anchor="middle">from its grid stream</text>

  <!-- Window-to-helm edge: the window uses only the helm's API, even in one process -->
  <line x1="304" y1="178" x2="518" y2="178" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="412" y="168" font-size="11" font-weight="600" fill="#24292f" text-anchor="middle">loopback only</text>
  <text x="412" y="196" font-size="11" fill="#57606a" text-anchor="middle">UI channel · terminal streams</text>
  <text x="412" y="211" font-size="11" fill="#57606a" text-anchor="middle">file transfers</text>

  <rect x="520" y="120" width="300" height="112" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.1"/>
  <text x="670" y="150" font-size="14.5" font-weight="700" fill="#24292f" text-anchor="middle">Helm — built into the app</text>
  <text x="670" y="172" font-size="11" fill="#57606a" text-anchor="middle">your hosts · every host's sessions</text>
  <text x="670" y="190" font-size="11" fill="#57606a" text-anchor="middle">approvals · launch templates · preferences</text>
  <text x="670" y="208" font-size="11" fill="#57606a" text-anchor="middle">relays each terminal's grid stream and input</text>

  <!-- helm.db cylinder -->
  <line x1="820" y1="176" x2="888" y2="176" stroke="#24292f" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="864" y="168" font-size="10.5" fill="#57606a" text-anchor="middle">persists</text>
  <path d="M894,152 v44 a70,9 0 0 0 140,0 v-44" fill="#fff1d6" stroke="#b45309" stroke-width="1.4"/>
  <ellipse cx="964" cy="152" rx="70" ry="9" fill="#ffe3b3" stroke="#b45309" stroke-width="1.4"/>
  <text x="964" y="184" font-size="12" font-weight="700" fill="#8a4b06" text-anchor="middle">helm.db</text>
  <text x="964" y="226" font-size="11" fill="#57606a" text-anchor="middle">hosts · last-known sessions</text>
  <text x="964" y="241" font-size="11" fill="#57606a" text-anchor="middle">preferences · templates</text>

  <!-- Helm-to-supervisor edges -->
  <line x1="590" y1="232" x2="186" y2="410" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="330" y="300" font-size="11" fill="#57606a" text-anchor="end">local — no SSH</text>
  <text x="330" y="316" font-size="11" fill="#57606a" text-anchor="end">on a Mac: started by the app,</text>
  <text x="330" y="331" font-size="11" fill="#57606a" text-anchor="end">keeps running after you quit</text>

  <line x1="740" y1="232" x2="740" y2="410" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="752" y="300" font-size="11" fill="#57606a" text-anchor="start">SSH — supervisor listens on no port</text>
  <text x="752" y="316" font-size="11" fill="#57606a" text-anchor="start">Linux: a systemd user service</text>
  <text x="752" y="331" font-size="11" fill="#57606a" text-anchor="start">Apple-silicon Mac: a launchd job</text>

  <!-- The host regions and the footer are laid out with the regions starting
       at y=414 and lifted 40px as one group. The helm's edges above therefore
       end at y=410, the supervisors' top edge (y=452 in the group, 412 after the lift). -->
  <g transform="translate(0 -40)">
    <!-- Local host -->
    <rect x="40" y="414" width="520" height="316" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
    <text x="56" y="437" font-size="12.5" font-weight="600" fill="#57606a">your machine (local host)</text>

    <!-- Remote host, with a ghost behind it suggesting more hosts -->
    <rect x="616" y="430" width="520" height="316" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
    <rect x="600" y="414" width="520" height="316" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
    <text x="616" y="437" font-size="12.5" font-weight="600" fill="#57606a">remote host — Linux or Apple-silicon Mac</text>
    <text x="1104" y="437" font-size="11" font-style="italic" fill="#8b949e" text-anchor="end">· any number of these</text>

    <!-- Supervisors (dashed: restartable) -->
    <rect x="70" y="452" width="220" height="72" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="180" y="476" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">Supervisor</text>
    <text x="180" y="494" font-size="11" fill="#57606a" text-anchor="middle">authority on its sessions</text>
    <text x="180" y="510" font-size="11" fill="#57606a" text-anchor="middle">terminal emulator per terminal</text>

    <rect x="630" y="452" width="220" height="72" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="740" y="476" font-size="14" font-weight="700" fill="#24292f" text-anchor="middle">Supervisor</text>
    <text x="740" y="494" font-size="11" fill="#57606a" text-anchor="middle">authority on its sessions</text>
    <text x="740" y="510" font-size="11" fill="#57606a" text-anchor="middle">terminal emulator per terminal</text>

    <!-- supervisor.db cylinders -->
    <line x1="290" y1="480" x2="348" y2="480" stroke="#24292f" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="319" y="472" font-size="10.5" fill="#57606a" text-anchor="middle">writes</text>
    <path d="M350,458 v40 a75,9 0 0 0 150,0 v-40" fill="#fff1d6" stroke="#b45309" stroke-width="1.4"/>
    <ellipse cx="425" cy="458" rx="75" ry="9" fill="#ffe3b3" stroke="#b45309" stroke-width="1.4"/>
    <text x="425" y="487" font-size="12" font-weight="700" fill="#8a4b06" text-anchor="middle">supervisor.db</text>
    <text x="425" y="526" font-size="11" fill="#57606a" text-anchor="middle">sessions · boot id</text>
    <text x="425" y="540" font-size="11" fill="#57606a" text-anchor="middle">conversation ids</text>

    <line x1="850" y1="480" x2="908" y2="480" stroke="#24292f" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="879" y="472" font-size="10.5" fill="#57606a" text-anchor="middle">writes</text>
    <path d="M910,458 v40 a75,9 0 0 0 150,0 v-40" fill="#fff1d6" stroke="#b45309" stroke-width="1.4"/>
    <ellipse cx="985" cy="458" rx="75" ry="9" fill="#ffe3b3" stroke="#b45309" stroke-width="1.4"/>
    <text x="985" y="487" font-size="12" font-weight="700" fill="#8a4b06" text-anchor="middle">supervisor.db</text>
    <text x="985" y="526" font-size="11" fill="#57606a" text-anchor="middle">sessions · boot id</text>
    <text x="985" y="540" font-size="11" fill="#57606a" text-anchor="middle">conversation ids</text>

    <!-- Supervisor-to-terminal-host edges -->
    <line x1="180" y1="524" x2="180" y2="562" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="190" y="547" font-size="11" fill="#57606a" text-anchor="start">one socket per terminal</text>

    <line x1="740" y1="524" x2="740" y2="562" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="750" y="547" font-size="11" fill="#57606a" text-anchor="start">one socket per terminal</text>

    <!-- Terminal hosts (solid: outlive the supervisor). Each terminal in a
         session, the agent's and every shell tab's, is its own host process. -->
    <rect x="70" y="566" width="460" height="148" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.6"/>
    <text x="82" y="588" font-size="13" font-weight="700" fill="#24292f">terminal hosts — one per terminal</text>
    <text x="82" y="604" font-size="10.5" fill="#57606a">each holds its PTY, its program &amp; its output</text>

    <rect x="90" y="614" width="200" height="88" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.1"/>
    <text x="100" y="631" font-size="11" font-weight="600" fill="#57606a">session — ~/proj/app</text>
    <rect x="100" y="640" width="180" height="26" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.1"/>
    <text x="190" y="657" font-size="11" font-weight="600" fill="#0a4d8c" text-anchor="middle">Claude Code — real TUI</text>
    <rect x="100" y="672" width="180" height="22" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
    <text x="190" y="687" font-size="11" fill="#57606a" text-anchor="middle">shell tab</text>
    <text x="330" y="662" font-size="11" font-style="italic" fill="#8b949e">…more sessions</text>

    <rect x="630" y="566" width="460" height="148" rx="8" fill="#ffffff" stroke="#24292f" stroke-width="1.6"/>
    <text x="642" y="588" font-size="13" font-weight="700" fill="#24292f">terminal hosts — one per terminal</text>
    <text x="642" y="604" font-size="10.5" fill="#57606a">each holds its PTY, its program &amp; its output</text>

    <rect x="650" y="614" width="200" height="88" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.1"/>
    <text x="660" y="631" font-size="11" font-weight="600" fill="#57606a">session — ~/ws/api</text>
    <rect x="660" y="640" width="180" height="26" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.1"/>
    <text x="750" y="657" font-size="11" font-weight="600" fill="#0a4d8c" text-anchor="middle">Claude Code — real TUI</text>
    <rect x="660" y="672" width="180" height="22" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
    <text x="750" y="687" font-size="11" fill="#57606a" text-anchor="middle">shell tab</text>

    <rect x="870" y="614" width="200" height="88" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.1"/>
    <text x="880" y="631" font-size="11" font-weight="600" fill="#57606a">session — ~/ws/frontend</text>
    <rect x="880" y="640" width="180" height="26" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.1"/>
    <text x="970" y="657" font-size="11" font-weight="600" fill="#0a4d8c" text-anchor="middle">Codex — real TUI</text>
    <rect x="880" y="672" width="180" height="22" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
    <text x="970" y="687" font-size="11" fill="#57606a" text-anchor="middle">shell tab</text>

    <!-- Resume path: captured conversation id relaunches the exact conversation -->
    <path d="M1062,483 C1100,515 1100,575 1048,635" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrowA)"/>
    <text x="985" y="558" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">restart resumes the captured conversation</text>
    <text x="985" y="580" font-size="10" font-style="italic" fill="#b45309" text-anchor="middle">even after a host reboot</text>
    <text x="985" y="594" font-size="10" font-style="italic" fill="#b45309" text-anchor="middle">(fresh terminal, same conversation)</text>

    <!-- Durability story -->
    <text x="40" y="776" font-size="14" font-weight="700" fill="#24292f">Why a restart loses nothing</text>
    <text x="40" y="800" font-size="12" fill="#24292f">Farhelm quits or crashes → sessions untouched; on reopen the helm reloads hosts and last-known sessions from helm.db</text>
    <text x="40" y="822" font-size="12" fill="#24292f">supervisor restarts → terminal hosts and the agents in them keep running; its emulators rebuild from the hosts; supervisor.db still knows every session and conversation</text>
    <text x="40" y="844" font-size="12" fill="#24292f">host reboots → terminals are gone, conversations are not: sessions show interrupted, and restart resumes each one via its captured id (claude --resume &lt;id&gt;)</text>
    <text x="40" y="870" font-size="11" fill="#8b949e">dashed outline = disposable, restarts freely · solid = keeps running while its machine is up · amber cylinder = SQLite state, survives restarts and reboots · blue = the agent's real terminal</text>
  </g>
</svg>
